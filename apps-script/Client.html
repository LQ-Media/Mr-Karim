<script>
/**
 * The browser side.
 *
 * Google Identity Services signs the visitor in and hands us an ID token. That
 * token goes with every call and is verified server-side each time, so nothing
 * here is trusted: hiding a button does not protect anything, it just keeps the
 * interface honest about what the person can do.
 */

var S = {
  token: null,       // The signed session token from the server.
  me: null,          // Who is signed in.
  focusId: null,     // Who the view is centred on.
  view: null,
  thumbs: {},        // Portrait cache, keyed by person id.
  searchTimer: null
};

/* ------------------------------------------------------------------ *
 * Sign-in
 * ------------------------------------------------------------------ */

var SESSION_KEY = 'familyTreeSession';

/**
 * Picks up the session.
 *
 * A fresh sign-in arrives embedded in the page, because the server has just
 * exchanged Google's authorization code for it. A reload of the bare app URL
 * has no such token, so the last one is taken from sessionStorage -- which
 * keeps a refresh from bouncing the person back through Google.
 */
function loadSession() {
  if (SESSION) {
    S.token = SESSION;
    try { sessionStorage.setItem(SESSION_KEY, SESSION); } catch (e) { /* private mode */ }
    return true;
  }
  try {
    S.token = sessionStorage.getItem(SESSION_KEY) || null;
  } catch (e) {
    S.token = null;
  }
  return !!S.token;
}

function signOutLocally() {
  S.token = null;
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* private mode */ }
}

/** A session lasts twelve hours. When one runs out, send them back to Google. */
function reauth() {
  signOutLocally();
  gate('gateSignIn');
  show('signInError', 'Your sign-in has expired. Please sign in again.');
}

/* ------------------------------------------------------------------ *
 * Server calls
 * ------------------------------------------------------------------ */

function call(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res) return reject(new Error('No response from the server.'));
        if (res.ok) return resolve(res.data);
        if (/sign-?in (expired|required)/i.test(res.error)) {
          reauth();
          return reject(new Error(res.error));
        }
        reject(new Error(res.error));
      })
      .withFailureHandler(function (err) { reject(err); })
      [fnName].apply(null, [S.token].concat(args));
  });
}

/* ------------------------------------------------------------------ *
 * Routing
 * ------------------------------------------------------------------ */

function boot() {
  call('api_me').then(function (me) {
    S.me = me;
    document.getElementById('familyName').textContent = me.familyName || 'Family tree';

    if (me.isPending) return gate('gatePending');
    if (me.treeSize === 0 && me.isAdmin) return startTreeGate();
    if (me.needsBinding) return claimGate(me.unclaimed || []);

    gate('app');
    if (me.isAdmin) {
      var n = (me.adminCounts.pendingChanges || 0) + (me.adminCounts.pendingUsers || 0) +
              (me.adminCounts.mergeQueue || 0);
      var btn = document.getElementById('btnAdmin');
      btn.style.display = '';
      if (n) btn.innerHTML = '&#9881;<span class="dot">' + n + '</span>';
    }
    loadView(null);
  }).catch(function (err) {
    signOutLocally();
    gate('gateSignIn');
    show('signInError', err.message);
  });
}

/* Start here: either we have a session, or the person signs in. */
if (SIGN_IN_ERROR) {
  gate('gateSignIn');
  show('signInError', SIGN_IN_ERROR);
} else if (loadSession()) {
  boot();
} else {
  gate('gateSignIn');
}

function gate(id) {
  ['gateSignIn', 'gatePending', 'gateClaim', 'gateStart', 'app'].forEach(function (g) {
    document.getElementById(g).style.display = g === id ? '' : 'none';
  });
}

function show(id, text) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.style.display = '';
}

/* ------------------------------------------------------------------ *
 * First-run gates
 * ------------------------------------------------------------------ */

function claimGate(candidates) {
  gate('gateClaim');
  var list = document.getElementById('claimList');
  if (!candidates.length) {
    list.innerHTML = '<p class="empty">Nobody in the tree looks like you yet.</p>';
  } else {
    list.innerHTML = candidates.map(function (c) {
      return '<button class="match" style="width:100%;text-align:left" data-id="' + c.personId + '">' +
        '<div class="avatar">' + initials(c.name) + '</div>' +
        '<div class="who"><div class="nm">' + esc(c.name) + '</div>' +
        '<div class="why">' + (c.birthDate ? 'Born ' + esc(c.birthDate) : 'No birth date recorded') +
        '</div></div></button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('[data-id]'), function (btn) {
      btn.onclick = function () {
        call('api_claimPerson', btn.getAttribute('data-id'))
          .then(boot).catch(fail);
      };
    });
  }
  document.getElementById('claimNone').onclick = function () {
    toast('Ask a family admin to add you and link your account.');
  };
}

function startTreeGate() {
  gate('gateStart');
  document.getElementById('startForm').innerHTML =
    personFields({}, true) +
    '<button class="btn" id="startBtn" style="margin-top:8px">Create my record</button>';
  document.getElementById('startBtn').onclick = function () {
    var data = readPersonFields();
    if (!data.display_name) return toast('Please enter a name.', true);
    busy(this, true);
    call('api_startTree', data).then(boot).catch(function (e) { busy(null); fail(e); });
  };
}

/* ------------------------------------------------------------------ *
 * The me-centred view
 * ------------------------------------------------------------------ */

function loadView(focusId) {
  S.focusId = focusId;
  document.getElementById('view').innerHTML = '<div class="loading">Loading&hellip;</div>';
  document.getElementById('results').style.display = 'none';
  document.getElementById('search').value = '';

  call('api_view', focusId).then(function (view) {
    S.view = view;
    renderView(view);
    loadThumbs(view);
  }).catch(fail);
}

function renderView(v) {
  var html = centreCard(v.centre);

  html += section('Parents', v.parents, v.centre, 'parent_of', 'No parents recorded yet');
  html += section(v.spouses.length > 1 ? 'Marriages' : 'Spouse', v.spouses, v.centre,
                  'spouse_of', 'No marriage recorded');
  html += section('Brothers and sisters', v.siblings, v.centre, 'sibling_of', 'No siblings recorded');
  html += section('Children', v.children, v.centre, 'child_of', 'No children recorded');

  html += nextStep(v);

  document.getElementById('view').innerHTML = html;
  wireCards();
}

/**
 * What to enter next.
 *
 * Two hundred people is a lot of typing, and the order matters more than it
 * looks: build upward and outward from yourself and every new person has
 * somewhere to attach, which is what keeps the tree in one piece. Left to
 * improvise, people add whoever comes to mind and end up with fragments.
 *
 * The hint only appears on your own record, and only while the tree is small
 * enough for the advice to still be useful.
 */
function nextStep(v) {
  if (!v.centre.isYou || S.me.treeSize > 60) return '';

  var step = null;
  if (!v.parents.length) {
    step = 'Add <b>your parents</b> first, then their parents. Your side of the ' +
           'family grows upward from you.';
  } else if (!v.siblings.length && !v.spouses.length) {
    step = 'Add <b>your brothers and sisters</b> &mdash; oldest first, so their ' +
           'children get the right titles for them.';
  } else if (!v.spouses.length) {
    step = 'Add <b>your spouse</b>. Their family becomes the second tree, joined ' +
           'to this one through your marriage.';
  } else if (!v.children.length) {
    step = 'Add <b>your children</b>, oldest first &mdash; and open your spouse to ' +
           'add <b>their parents</b>, which starts their side of the family.';
  } else {
    step = 'Open <b>your spouse</b> and add <b>their parents</b> to build their side ' +
           'of the family. Then work outward: each person&rsquo;s siblings, then their ' +
           'children.';
  }

  return '<div class="nudge"><span class="mk">&#127793;</span>' +
         '<span class="tx">' + step + '</span></div>';
}

function centreCard(p) {
  var meta = [];
  if (p.birthDate) meta.push((p.isLiving ? 'b. ' : 'b. ') + year(p.birthDate));
  if (!p.isLiving) meta.push(p.deathDate ? 'd. ' + year(p.deathDate) : 'deceased');

  return '<div class="centre">' +
    avatar(p, 'avatar ' + genderClass(p.gender)) +
    '<div class="who">' +
      (p.isYou ? '' : '<span class="title-badge">' + esc(p.yourTitle) + '</span>') +
      '<div class="name">' + esc(p.name) + '</div>' +
      '<div class="meta">' + esc(meta.join(' · ')) + '</div>' +
    '</div>' +
    '<button class="icon-btn" data-open="' + p.personId + '" title="Details">&#8250;</button>' +
  '</div>';
}

/**
 * One relationship row.
 *
 * Each card leads with the title the VIEWER uses, not the label that applies at
 * the centre of the screen -- that is the whole point of the app, and it stays
 * true however far into a distant branch someone wanders. The smaller line
 * underneath says how the person sits relative to whoever is centred, which is
 * what stops a cousin's household from being confusing.
 */
function section(heading, people, centre, relationship, emptyText) {
  var cards = people.map(function (p) {
    var sub = p.isYou ? 'you' : p.roleHere;
    return '<button class="card' + (p.isYou ? ' you' : '') + '" data-focus="' + p.personId + '">' +
      avatar(p, 'avatar ' + genderClass(p.gender)) +
      '<div class="ttl">' + esc(p.isYou ? 'You' : p.yourTitle) + '</div>' +
      '<div class="nm">' + esc(p.name) + '</div>' +
      '<div class="yr">' + esc(sub) + (p.birthDate ? ' · ' + year(p.birthDate) : '') + '</div>' +
    '</button>';
  });

  // Children and siblings are entered a generation at a time, because that is
  // how families recall themselves and because the order they are listed in is
  // what the Malay titles need.
  var batch = relationship === 'child_of' || relationship === 'sibling_of';

  if (centre.editable) {
    cards.push('<button class="card add" data-add="' + relationship +
      '" data-batch="' + (batch ? '1' : '0') + '">' +
      '<div class="plus">+</div><div class="nm">' + (batch ? 'Add several' : 'Add') +
      '</div></button>');
  }

  var tools = '';
  if (relationship === 'child_of' && centre.editable && people.length > 1) {
    tools = '<button class="add" data-reorder="1">Reorder</button>';
  }

  return '<div class="section">' +
    '<div class="section-head"><h2>' + esc(heading) + '</h2>' + tools + '</div>' +
    (cards.length ? '<div class="row">' + cards.join('') + '</div>'
                  : '<div class="empty">' + esc(emptyText) + '</div>') +
  '</div>';
}

function wireCards() {
  var view = document.getElementById('view');
  Array.prototype.forEach.call(view.querySelectorAll('[data-focus]'), function (el) {
    el.onclick = function () { loadView(el.getAttribute('data-focus')); };
  });
  Array.prototype.forEach.call(view.querySelectorAll('[data-open]'), function (el) {
    el.onclick = function () { openPerson(el.getAttribute('data-open')); };
  });
  Array.prototype.forEach.call(view.querySelectorAll('[data-add]'), function (el) {
    el.onclick = function () {
      var relationship = el.getAttribute('data-add');
      if (el.getAttribute('data-batch') === '1') openBatch(S.view.centre.personId, relationship);
      else openAdd(S.view.centre.personId, relationship);
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll('[data-reorder]'), function (el) {
    el.onclick = function () { openReorder(); };
  });
}

/** Portraits for everyone on screen, in one call rather than one per face. */
function loadThumbs(v) {
  var ids = [];
  [[v.centre], v.parents, v.spouses, v.siblings, v.children].forEach(function (group) {
    group.forEach(function (p) {
      if (p && p.hasPhoto && !S.thumbs[p.personId]) ids.push(p.personId);
    });
  });
  if (!ids.length) return paintThumbs();

  call('api_thumbnails', ids).then(function (map) {
    for (var id in map) if (map.hasOwnProperty(id)) S.thumbs[id] = map[id];
    paintThumbs();
  }).catch(function () { /* A missing portrait is not worth an error. */ });
}

function paintThumbs() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-photo]'), function (el) {
    var id = el.getAttribute('data-photo');
    if (S.thumbs[id] && !el.querySelector('img')) {
      el.innerHTML = '<img src="' + S.thumbs[id] + '" alt="">';
    }
  });
}

/* ------------------------------------------------------------------ *
 * Person detail
 * ------------------------------------------------------------------ */

function openPerson(personId) {
  openSheet('<div class="loading">Loading&hellip;</div>');
  call('api_person', personId).then(function (p) {
    var facts = [];
    function fact(k, v) { if (v) facts.push('<div class="fact"><div class="k">' + k +
      '</div><div class="v">' + esc(String(v)) + '</div></div>'); }

    fact('Full name', p.full_name);
    fact('Also known as', p.also_known_as);
    fact('Born', datePhrase(p.birth_date, p.birth_precision));
    fact('Birthplace', p.birth_place);
    if (p.is_living === 'FALSE') {
      fact('Died', datePhrase(p.death_date, p.death_precision));
      fact('Place of death', p.death_place);
      fact('Buried', p.burial_place);
    }
    fact('Occupation', p.occupation);
    fact('Email', p.email);
    fact('Mobile', p.mobile);
    fact('Address', p.address);
    if (p.derivedBirthOrder) {
      fact('Birth order', p.derivedBirthOrder + ' of ' + p.siblingCount +
        (p.birth_order ? '' : ' (worked out from birth dates)'));
    }
    fact('Notes', p.notes);

    var html =
      '<h2>' + esc(p.display_name) + '</h2>' +
      '<div class="sub">You call them <strong>' + esc(p.yourTitle) + '</strong>' +
        (p.titleSource === 'custom' ? ' (set by your family)' : '') + '</div>' +
      '<div class="facts">' + (facts.join('') || '<div class="empty">Nothing recorded yet.</div>') + '</div>' +
      '<div class="btn-row">' +
        (p.editable ? '<button class="btn" id="editBtn">Edit</button>' +
                      '<button class="btn ghost" id="photoBtn">Photo</button>' : '') +
        '<button class="btn ghost" id="titleBtn">Rename title</button>' +
      '</div>' +
      '<input type="file" id="photoInput" accept="image/*" class="sr">';

    openSheet(html);

    if (p.editable) {
      document.getElementById('editBtn').onclick = function () { openEdit(p); };
      document.getElementById('photoBtn').onclick = function () {
        document.getElementById('photoInput').click();
      };
      document.getElementById('photoInput').onchange = function (e) {
        if (e.target.files[0]) uploadPhoto(personId, e.target.files[0]);
      };
    }
    document.getElementById('titleBtn').onclick = function () { openTitle(p); };
  }).catch(fail);
}

function openEdit(p) {
  openSheet(
    '<h2>Edit ' + esc(p.display_name) + '</h2>' +
    '<div class="sub">Changes outside your own branch are sent to a family admin first.</div>' +
    personFields(p, false) +
    '<div class="btn-row"><button class="btn" id="saveBtn">Save</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');

  document.getElementById('saveBtn').onclick = function () {
    var data = readPersonFields();
    busy(this, true);
    call('api_updatePerson', p.personId, data).then(function (res) {
      closeSheet();
      toast(res.status === 'pending_approval'
        ? 'Sent to a family admin for approval.' : 'Saved.');
      if (res.status !== 'pending_approval') loadView(S.focusId);
    }).catch(function (e) { busy(null); fail(e); });
  };
}

/** The family's own name for someone, overriding what the engine worked out. */
function openTitle(p) {
  openSheet(
    '<h2>What you call ' + esc(p.display_name) + '</h2>' +
    '<div class="sub">The app worked out <strong>' + esc(p.yourTitle) + '</strong>. If your ' +
      'family uses a different name for them, put it here -- it only changes what ' +
      '<em>you</em> see, unless you set it for everyone.</div>' +
    '<div class="field"><label>Your name for them</label>' +
      '<input id="customTitle" placeholder="' + esc(p.yourTitle) + '" maxlength="60"></div>' +
    (S.me.isAdmin ? '<div class="field"><label>' +
      '<input type="checkbox" id="titleGlobal" style="width:auto;margin-right:8px">' +
      'Use this for the whole family</label></div>' : '') +
    '<div class="btn-row"><button class="btn" id="titleSave">Save</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');

  document.getElementById('titleSave').onclick = function () {
    var label = document.getElementById('customTitle').value;
    var globalEl = document.getElementById('titleGlobal');
    busy(this, true);
    call('api_setCustomTitle', p.personId, label,
         globalEl && globalEl.checked ? 'GLOBAL' : 'ME', '*')
      .then(function () { closeSheet(); toast('Saved.'); loadView(S.focusId); })
      .catch(function (e) { busy(null); fail(e); });
  };
}

/* ------------------------------------------------------------------ *
 * Adding someone
 * ------------------------------------------------------------------ */

var ADD_WORDING = {
  parent_of: 'a parent of', child_of: 'a child of',
  spouse_of: 'married to', sibling_of: 'a brother or sister of'
};

function openAdd(anchorId, relationship) {
  var anchorName = S.view.centre.name;
  openSheet(
    '<h2>Add someone</h2>' +
    '<div class="sub">This person will be recorded as <strong>' +
      ADD_WORDING[relationship] + ' ' + esc(anchorName) + '</strong>.</div>' +
    '<div id="dupeZone"></div>' +
    personFields({}, true) +
    (relationship === 'spouse_of' ? marriageFields() : '') +
    '<div class="btn-row"><button class="btn" id="addBtn">Add them</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');

  document.getElementById('addBtn').onclick = function () {
    submitAdd(anchorId, relationship, false);
  };
}

/**
 * Submits a new person.
 *
 * The first attempt asks the server to look for anyone this might already be.
 * If it finds someone, the form stays exactly as it is and the matches appear
 * above it, so the person entering data can link instead of duplicating without
 * losing what they typed. Only a deliberate second press creates a new record.
 */
function submitAdd(anchorId, relationship, ignoreDuplicates) {
  var data = readPersonFields();
  if (!data.display_name) return toast('Please enter a name.', true);
  Object.assign(data, readMarriageFields());

  var btn = document.getElementById('addBtn');
  busy(btn, true);

  call('api_addPerson', anchorId, relationship, data, { ignoreDuplicates: ignoreDuplicates })
    .then(function (res) {
      busy(btn, false);
      if (res.status === 'possible_duplicate') return showDuplicates(res, anchorId, relationship);
      closeSheet();
      toast(res.status === 'pending_approval'
        ? 'Sent to a family admin for approval.' : 'Added.');
      if (res.status !== 'pending_approval') loadView(S.focusId);
    })
    .catch(function (e) { busy(btn, false); fail(e); });
}

function showDuplicates(res, anchorId, relationship) {
  var matches = res.candidates.map(function (c) {
    var why = c.why.length ? c.why.join(', ') : 'similar details';
    var line = [c.fatherName ? 'father: ' + c.fatherName : '',
                c.birthDate ? 'b. ' + year(c.birthDate) : ''].filter(Boolean).join(' · ');
    return '<div class="match">' +
      '<div class="avatar">' + initials(c.name) + '</div>' +
      '<div class="who"><div class="nm">' + esc(c.name) +
        (c.yourTitle ? ' <span class="score">' + esc(c.yourTitle) + '</span>' : '') + '</div>' +
        (line ? '<div class="why">' + esc(line) + '</div>' : '') +
        '<div class="why">Matched on ' + esc(why) + '</div></div>' +
      '<button class="btn sm" data-link="' + c.personId + '">This one</button>' +
    '</div>';
  }).join('');

  document.getElementById('dupeZone').innerHTML =
    '<div class="dupe">' +
      '<h3>Is this someone already in the tree?</h3>' +
      '<p>Adding a second copy of the same person is how a family tree quietly ' +
         'splits in two. Pick them if you recognise them.</p>' +
      matches +
      '<button class="btn ghost sm" id="notThem" style="width:100%">' +
        'None of these &mdash; add as a new person</button>' +
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('[data-link]'), function (btn) {
    btn.onclick = function () {
      busy(btn, true);
      call('api_linkExisting', anchorId, relationship, btn.getAttribute('data-link'),
           readMarriageFields())
        .then(function (r) {
          closeSheet();
          toast(r.status === 'pending_approval'
            ? 'Sent to a family admin for approval.' : 'Connected.');
          if (r.status !== 'pending_approval') loadView(S.focusId);
        })
        .catch(function (e) { busy(btn, false); fail(e); });
    };
  });

  document.getElementById('notThem').onclick = function () {
    submitAdd(anchorId, relationship, true);
  };
  document.getElementById('sheet').scrollTop = 0;
}

/* ------------------------------------------------------------------ *
 * Adding a generation at once
 * ------------------------------------------------------------------ */

var BATCH_WORDING = {
  child_of: { title: 'Add children of ', noun: 'children' },
  sibling_of: { title: 'Add brothers and sisters of ', noun: 'brothers and sisters' }
};

/**
 * The fast path.
 *
 * Entering two hundred relatives one form at a time is what kills a family tree
 * before it is worth looking at. Here a whole generation goes in at once, with
 * only the three things somebody reliably knows off the top of their head: the
 * name, whether they are a son or a daughter, and roughly when they were born.
 *
 * Listing them oldest first is not housekeeping. Their position becomes their
 * birth order, which is precisely what decides whether an uncle is Pak Long or
 * Pak Su -- so the app collects the hardest fact in the system as a side effect
 * of the way people naturally recite a family.
 */
function openBatch(anchorId, relationship) {
  var wording = BATCH_WORDING[relationship];
  openSheet(
    '<h2>' + wording.title + esc(S.view.centre.name) + '</h2>' +
    '<div class="sub">List them <strong>oldest first</strong>. That order is what ' +
      'decides their titles &mdash; Pak Long for the eldest, Pak Su for the youngest &mdash; ' +
      'so it is worth getting right, and you can change it later.</div>' +
    '<div id="batchRows"></div>' +
    '<button class="btn ghost sm" id="addRow" style="width:100%;margin-top:4px">' +
      '+ Another</button>' +
    '<div class="btn-row"><button class="btn" id="batchSave">Add them</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');

  var rows = 0;
  function addRow() {
    rows++;
    var i = rows;
    var el = document.createElement('div');
    el.className = 'batch-row';
    el.innerHTML =
      '<span class="ord">' + i + '</span>' +
      '<input id="b_name_' + i + '" placeholder="Name" maxlength="120">' +
      select('b_gender_' + i, [['U', '\u2014'], ['M', 'Son'], ['F', 'Daughter']], 'U') +
      '<input id="b_year_' + i + '" type="number" placeholder="Year" min="1700" max="2100">';
    document.getElementById('batchRows').appendChild(el);
    if (i === 1) document.getElementById('b_name_1').focus();
  }
  for (var n = 0; n < 4; n++) addRow();

  document.getElementById('addRow').onclick = addRow;
  document.getElementById('batchSave').onclick = function () {
    submitBatch(anchorId, relationship, rows, null);
  };

  // Typing in the last row adds another, so entering nine children never means
  // stopping to press a button.
  document.getElementById('batchRows').addEventListener('input', function (e) {
    if (e.target.id === 'b_name_' + rows && e.target.value) addRow();
  });
}

function readBatchRows(count) {
  var rows = [];
  for (var i = 1; i <= count; i++) {
    var nameEl = document.getElementById('b_name_' + i);
    if (!nameEl || !nameEl.value.trim()) continue;
    var gender = document.getElementById('b_gender_' + i).value;
    var yearEl = document.getElementById('b_year_' + i);
    var row = { display_name: nameEl.value.trim(), full_name: nameEl.value.trim() };
    if (gender !== 'U') row.gender = gender;
    if (yearEl && yearEl.value) {
      row.birth_date = yearEl.value + '-01-01';
      row.birth_precision = 'year';
    }
    rows.push(row);
  }
  return rows;
}

function submitBatch(anchorId, relationship, rowCount, decisions) {
  var rows = S.batchRows || readBatchRows(rowCount);
  if (!rows.length) return toast('Enter at least one name.', true);
  S.batchRows = rows;

  var btn = document.getElementById('batchSave');
  busy(btn, true);

  call('api_addBatch', anchorId, relationship, rows, decisions).then(function (res) {
    busy(btn, false);
    if (res.status === 'possible_duplicate') {
      return reviewBatch(res.rows, anchorId, relationship, rows);
    }
    S.batchRows = null;
    closeSheet();
    if (res.status === 'pending_approval') return toast('Sent to a family admin for approval.');
    toast('Added ' + res.created + (res.linked ? ', linked ' + res.linked : '') + '.');
    loadView(S.focusId);
  }).catch(function (e) { busy(btn, false); S.batchRows = null; fail(e); });
}

/**
 * Some of the batch might already be in the tree.
 *
 * Nothing was written -- a half-applied batch would leave the tree in a state
 * nobody asked for -- so each uncertain row is settled here and the whole thing
 * is sent again. Rows the app had no doubt about are not shown; there is nothing
 * to decide about them.
 */
function reviewBatch(flagged, anchorId, relationship, rows) {
  var uncertain = flagged.filter(function (r) { return r.candidates.length; });

  openSheet(
    '<h2>Some of these may already be here</h2>' +
    '<div class="sub">Nothing has been saved yet. Link the ones you recognise, and ' +
      'the rest will be added as new people.</div>' +
    uncertain.map(function (row) {
      return '<div class="dupe"><h3>' + esc(row.name) + '</h3>' +
        row.candidates.map(function (c) {
          return '<label class="match" style="cursor:pointer">' +
            '<input type="radio" name="row' + row.index + '" value="' + c.personId +
              '" style="width:auto;flex:none">' +
            '<div class="who"><div class="nm">' + esc(c.fullName || c.name) + '</div>' +
            '<div class="why">' + esc([c.fatherName ? 'father: ' + c.fatherName : '',
              c.birthDate ? 'b. ' + year(c.birthDate) : '',
              c.why.join(', ')].filter(Boolean).join(' \u00b7 ')) + '</div></div>' +
            '<span class="score">' + c.score + '%</span></label>';
        }).join('') +
        '<label class="match" style="cursor:pointer">' +
          '<input type="radio" name="row' + row.index + '" value="new" checked ' +
            'style="width:auto;flex:none">' +
          '<div class="who"><div class="nm">Add as a new person</div>' +
          '<div class="why">None of the above is them</div></div></label>' +
      '</div>';
    }).join('') +
    '<div class="btn-row"><button class="btn" id="batchSave">Save them</button>' +
    '<button class="btn ghost" onclick="closeSheet();S.batchRows=null">Cancel</button></div>');

  document.getElementById('batchSave').onclick = function () {
    var decisions = {};
    flagged.forEach(function (row) {
      var picked = document.querySelector('input[name="row' + row.index + '"]:checked');
      decisions[String(row.index)] = (!picked || picked.value === 'new')
        ? { action: 'create' }
        : { action: 'link', personId: picked.value };
    });
    // Rows the matcher was sure about still need a decision, or the server will
    // treat the batch as unreviewed and ask again.
    rows.forEach(function (_, i) {
      if (!decisions[String(i)]) decisions[String(i)] = { action: 'create' };
    });
    submitBatch(anchorId, relationship, rows.length, decisions);
  };
}

/**
 * Putting a generation back in order.
 *
 * A family entered out of sequence gets the wrong titles, and since these words
 * are used daily somebody will notice within the hour. The order is stated
 * directly rather than by editing one person's number, because the ranks only
 * mean anything relative to each other.
 */
function openReorder() {
  var children = S.view.children.slice();
  var parentId = S.view.centre.personId;

  function draw() {
    openSheet(
      '<h2>Order of ' + esc(S.view.centre.name) + '\u2019s children</h2>' +
      '<div class="sub">Oldest at the top. This is what decides Pak Long, Mak Ngah ' +
        'and Pak Su for the next generation.</div>' +
      '<div id="orderList">' + children.map(function (c, i) {
        return '<div class="match">' +
          '<span class="score">' + (i + 1) + '</span>' +
          '<div class="who"><div class="nm">' + esc(c.name) + '</div>' +
          '<div class="why">' + esc(c.birthDate ? 'b. ' + year(c.birthDate)
                                                : 'no birth date recorded') + '</div></div>' +
          '<button class="btn sm ghost" data-up="' + i + '" ' +
            (i === 0 ? 'disabled' : '') + '>\u2191</button>' +
          '<button class="btn sm ghost" data-down="' + i + '" ' +
            (i === children.length - 1 ? 'disabled' : '') + '>\u2193</button>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="btn-row"><button class="btn" id="orderSave">Save order</button>' +
      '<button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');

    function swap(a, b) {
      var tmp = children[a]; children[a] = children[b]; children[b] = tmp;
      draw();
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function (b) {
      b.onclick = function () { var i = Number(b.getAttribute('data-up')); swap(i, i - 1); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-down]'), function (b) {
      b.onclick = function () { var i = Number(b.getAttribute('data-down')); swap(i, i + 1); };
    });
    document.getElementById('orderSave').onclick = function () {
      busy(this, true);
      call('api_reorderSiblings', parentId, children.map(function (c) { return c.personId; }))
        .then(function () { closeSheet(); toast('Order saved.'); loadView(S.focusId); })
        .catch(function (e) { busy(null); fail(e); });
    };
  }
  draw();
}

/**
 * Downscales in the browser before uploading.
 *
 * Apps Script has no image API, so nothing can be resized once it arrives, and
 * a modern phone photo is several megabytes. Two sizes are produced: a full
 * image capped at 1200px and a thumbnail at 256px, which is what the card grid
 * loads.
 */
function uploadPhoto(personId, file) {
  toast('Preparing photo…');
  Promise.all([downscale(file, 1200, 0.82), downscale(file, 256, 0.75)])
    .then(function (sizes) {
      return call('api_uploadPhoto', personId,
        { full: sizes[0], thumb: sizes[1], mime: 'image/jpeg' });
    })
    .then(function (res) {
      if (res.status === 'pending_approval') return toast('Photo sent for approval.');
      delete S.thumbs[personId];
      toast('Photo saved.');
      closeSheet();
      loadView(S.focusId);
    })
    .catch(fail);
}

function downscale(file, maxEdge, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('That file could not be read.')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('That does not look like an image.')); };
      img.onload = function () {
        var scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderMerges(merges) {
  if (!merges.length) {
    return '<div class="empty">No suspected duplicates.</div>' +

  }
  return merges.map(function (m) {

      '<div class="what">Possibly the same person · ' + m.score + '% match</div>' +
      '<div class="who">' + esc(m.signals.filter(function (s) { return s.points > 0; })
        .map(function (s) { return s.signal.replace(/_/g, ' '); }).join(', ')) + '</div>' +
      '<div class="side-by-side">' + mergeSide(m.a) + mergeSide(m.b) + '</div>' +

          '">Different people</button>' +
      '</div></div>';
  }).join('') + '<button class="btn ghost" id="rescan">Scan again</button>';

function mergeSide(s) {

  // markup survives while the names stay escaped.
  var lines = [
    s.birthDate ? 'b. ' + year(s.birthDate) : '',
    s.fatherName ? 'father: ' + s.fatherName : '',
    s.childCount + ' children'

    '<div class="l">' + lines + '</div>' +

/**
 * The settings an admin can change without opening the spreadsheet.
 *
 * The birth-order sequence is the one that earns its place here. Long, Ngah,
 * Alang and the rest vary by family and by region, and a family shown the wrong
 * word for an uncle they have called Pak Ngah their whole life will not trust
 * anything else the app says. The preview shows the effect immediately, because
 * the list of words on its own means nothing until you see the titles it makes.
 */
function loadSettings() {
  call('api_settings').then(function (cfg) {
    document.getElementById('adminBody').innerHTML =
      field('Family name', '<input id="s_family_name" value="' + attr(cfg.family_name) +
        '" maxlength="80">', 'Shown at the top of every screen.') +

      field('Order of siblings, eldest first',
        '<input id="s_birth_order_titles" value="' + attr(cfg.birth_order_titles) +
          '" maxlength="140">',
        'Separate with commas. The youngest is always Su and is not in this list. ' +
        'Families and regions differ \u2014 use yours.') +
      '<div class="preview" id="titlePreview"></div>' +
      '<button class="btn ghost sm" id="resetTitles" style="margin-top:8px">' +
        'Back to the common sequence</button>' +

      field('Titles shown by default', select('s_default_lang',
        [['ms', 'Bahasa Melayu'], ['en', 'English'], ['ar', 'Arabic']], cfg.default_lang),
        'Each person can change this for themselves.') +

      field('Who may invite', select('s_allow_member_invites',
        [['TRUE', 'Anyone in the family'], ['FALSE', 'Admins only']],
        String(cfg.allow_member_invites).toUpperCase() === 'TRUE' ? 'TRUE' : 'FALSE'),
        'Letting relatives invite their own side is how a tree spreads without ' +
        'you being the bottleneck.') +

      field('Flag a possible duplicate above',
        '<input id="s_merge_queue_threshold" type="number" min="40" max="99" value="' +
          attr(cfg.merge_queue_threshold) + '">',
        'Lower catches more duplicates and asks you more often.') +

      '<div class="btn-row"><button class="btn" id="saveSettings">Save</button></div>';

    var titlesInput = document.getElementById('s_birth_order_titles');

    function preview() {
      var list = titlesInput.value.split(',')
        .map(function (t) { return t.replace(/[^A-Za-z' -]/g, '').trim(); })
        .filter(Boolean).slice(0, 12);
      var shown = list.map(function (t, i) {
        return (i === 0 ? 'Pak ' : 'Mak ') + t;
      });
      shown.push('Pak Su');
      document.getElementById('titlePreview').innerHTML =
        '<span class="lbl">Your uncles and aunts would be called</span>' +
        esc(shown.join(' \u00b7 ')) +
        (list.length ? '' : ' \u2014 with no list, everyone is simply Pak Cik or Mak Cik');
    }
    titlesInput.oninput = preview;
    preview();

    document.getElementById('resetTitles').onclick = function () {
      titlesInput.value = cfg.defaults.birth_order_titles;
      preview();
    };

    document.getElementById('saveSettings').onclick = function () {
      var changes = {};
      ['family_name', 'birth_order_titles', 'default_lang', 'allow_member_invites',
       'merge_queue_threshold'].forEach(function (key) {
        var el = document.getElementById('s_' + key);
        if (el) changes[key] = el.value;
      });
      busy(this, true);
      call('api_saveSettings', changes).then(function () {
        toast('Saved.');
        closeSheet();
        boot();
      }).catch(function (e) { busy(null); fail(e); });
    };
  }).catch(fail);
}

function wireAdmin() {
  function bind(attrName, handler) {
    Array.prototype.forEach.call(document.querySelectorAll('[' + attrName + ']'), function (b) {
      b.onclick = function () { handler(b.getAttribute(attrName), b); };
    });
  }
  bind('data-approve', function (id, b) {
    busy(b, true);
    call('api_approveChange', id, '').then(function () { toast('Approved.'); openAdmin(); })
      .catch(function (e) { busy(b, false); fail(e); });
  });
  bind('data-reject', function (id, b) {
    busy(b, true);
    call('api_rejectChange', id, '').then(function () { toast('Rejected.'); openAdmin(); })
      .catch(function (e) { busy(b, false); fail(e); });
  });
  bind('data-merge', function (pair, b) {
    var ids = pair.split('|');
    if (!confirm('Merge these two records into one? This cannot be undone from here.')) return;
    busy(b, true);
    call('api_merge', ids[0], ids[1], null).then(function () { toast('Merged.'); openAdmin(); })
      .catch(function (e) { busy(b, false); fail(e); });
  });
  bind('data-dismiss', function (id, b) {
    busy(b, true);
    call('api_dismissMerge', id, '').then(function () { toast('Marked as different people.'); openAdmin(); })
      .catch(function (e) { busy(b, false); fail(e); });
  });
  bind('data-admit', function (email, b) {
    busy(b, true);
    call('api_approveUser', email, '', 'member').then(function () {
      toast('They can sign in now.'); openAdmin();
    }).catch(function (e) { busy(b, false); fail(e); });
  });
  var rescan = document.getElementById('rescan');
  if (rescan) rescan.onclick = function () {
    busy(rescan, true);
    call('api_rebuildMergeQueue').then(function (r) {
      toast('Found ' + r.added + ' new to check.'); openAdmin();
    }).catch(function (e) { busy(rescan, false); fail(e); });
  };
}

/* ------------------------------------------------------------------ *
 * Sheet, toast and small helpers
 * ------------------------------------------------------------------ */

function openSheet(html) {
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').scrollTop = 0;
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('scrim').onclick = closeSheet;

function toast(text, bad) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.className = 'toast'; }, 3400);
}

function fail(err) { toast(err && err.message ? err.message : String(err), true); }

function busy(btn, on) {
  if (!btn) return;
  if (on) {
    btn._label = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
  } else if (btn._label) {
    btn.innerHTML = btn._label;
    btn.disabled = false;
  }
}

function avatar(p, cls) {
  return '<div class="' + cls + '" data-photo="' + p.personId + '">' +
    (S.thumbs[p.personId] ? '<img src="' + S.thumbs[p.personId] + '" alt="">'
                          : initials(p.name)) + '</div>';
}

function initials(name) {
  var parts = String(name || '?').replace(/^\s+|\s+$/g, '').split(/\s+/);
  var first = parts[0] ? parts[0][0] : '?';
  var second = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return esc((first + second).toUpperCase());
}

function genderClass(g) { return g === 'F' ? 'f' : (g === 'M' ? 'm' : ''); }

function year(date) { return date ? String(date).slice(0, 4) : ''; }

/** Dates are often approximate for an older generation, and saying so is more
 *  honest than printing a precise date nobody actually knows. */
function datePhrase(date, precision) {
  if (!date) return '';
  var text = String(date);
  if (precision === 'year') return text.slice(0, 4);
  if (precision === 'month') return text.slice(0, 7);
  if (precision === 'about') return 'about ' + text.slice(0, 4);
  if (precision === 'unknown') return '';
  return text.slice(0, 10);
}

function esc(text) {
  return String(text === undefined || text === null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function attr(text) { return esc(text); }
