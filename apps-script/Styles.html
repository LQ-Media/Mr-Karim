<style>
/* Mobile-first. The people who will use this most are relatives on phones in a
   WhatsApp group, not anyone at a desk. */
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-2: #f2ece3;
  --line: #e2d9cc;
  --ink: #24201b;
  --ink-2: #6b6155;
  --ink-3: #9a9086;
  --accent: #1f6f5c;
  --accent-soft: #e4f0ec;
  --accent-ink: #14503f;
  --warn: #9a5b12;
  --warn-soft: #fdf1e0;
  --danger: #a33124;
  --danger-soft: #fbeae7;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(36,32,27,.06), 0 6px 20px rgba(36,32,27,.07);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171512; --surface: #221f1b; --surface-2: #2c2823; --line: #3a352e;
    --ink: #f0ebe3; --ink-2: #b5aca0; --ink-3: #857c71;
    --accent: #5fbba1; --accent-soft: #1d3b34; --accent-ink: #9fd9c8;
    --warn: #e0a463; --warn-soft: #3a2c17; --danger: #e08579; --danger-soft: #3d201c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  font-size: 16px; line-height: 1.5; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
h1,h2,h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }

/* ---- Header ---- */
.topbar {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
}
.topbar .brand { font-weight: 700; font-size: 17px; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2); font-size: 16px; flex: none;
  position: relative; border: 1px solid transparent;
}
.icon-btn:hover { border-color: var(--line); }
.icon-btn .dot {
  position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px;
  border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px;
  font-weight: 700; display: grid; place-items: center; padding: 0 4px;
}

/* ---- Search ---- */
.searchbar { padding: 10px 0 4px; }
.searchbar input {
  width: 100%; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); outline: none;
}
.searchbar input:focus { border-color: var(--accent); }

/* ---- Centre card ---- */
.centre {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin: 14px 0 6px;
  display: flex; gap: 14px; align-items: center;
}
.centre .avatar { width: 68px; height: 68px; font-size: 24px; }
.centre .who { min-width: 0; flex: 1; }
.centre .title-badge {
  display: inline-block; background: var(--accent-soft); color: var(--accent-ink);
  border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 650;
  margin-bottom: 4px;
}
.centre .name { font-size: 20px; font-weight: 680; line-height: 1.25; }
.centre .meta { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }

.avatar {
  width: 50px; height: 50px; border-radius: 50%; flex: none; object-fit: cover;
  background: var(--surface-2); display: grid; place-items: center;
  font-weight: 650; color: var(--ink-3); overflow: hidden;
}
.avatar.f { background: #f5e6ec; color: #96586f; }
.avatar.m { background: #e3ecf5; color: #4d6d90; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .avatar.f { background: #3b2a31; color: #d79fb4; }
  :root:not([data-theme="light"]) .avatar.m { background: #263442; color: #9dc0e0; }
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ---- Relationship rows ---- */
.section { margin-top: 18px; }
.section-head {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; padding: 0 2px;
}
.section-head h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); font-weight: 700; }
.section-head .add {
  margin-left: auto; font-size: 13px; color: var(--accent); font-weight: 650;
}
.row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px;
  scroll-snap-type: x proximity; }
.row::-webkit-scrollbar { height: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; min-width: 132px; max-width: 132px; text-align: center;
  scroll-snap-align: start; display: flex; flex-direction: column; align-items: center;
  gap: 6px; transition: transform .12s ease, border-color .12s ease;
}
.card:active { transform: scale(.97); }
.card:hover { border-color: var(--accent); }
.card.you { border-color: var(--accent); background: var(--accent-soft); }
.card .ttl { font-size: 13px; font-weight: 700; color: var(--accent-ink); line-height: 1.2; }
.card .nm { font-size: 12.5px; color: var(--ink-2); line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .yr { font-size: 11px; color: var(--ink-3); }
.card.add {
  border-style: dashed; color: var(--ink-3); justify-content: center; min-height: 128px;
}
.card.add .plus { font-size: 26px; line-height: 1; }

.empty { color: var(--ink-3); font-size: 14px; padding: 6px 2px 10px; }

/* ---- Sheet ---- */
.scrim {
  position: fixed; inset: 0; background: rgba(20,17,14,.5); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--surface);
  border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto;
  transform: translateY(101%); transition: transform .24s cubic-bezier(.32,.72,0,1);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 40px rgba(0,0,0,.2);
}
.sheet.on { transform: translateY(0); }
@media (min-width: 720px) {
  .sheet { left: 50%; transform: translate(-50%, 101%); width: 640px;
           border-radius: 20px; bottom: 24px; max-height: 84vh; }
  .sheet.on { transform: translate(-50%, 0); }
}
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line);
  margin: 6px auto 12px; }
.sheet h2 { font-size: 19px; margin-bottom: 4px; }
.sheet .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }

/* ---- Forms ---- */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 650; color: var(--ink-2);
  margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 18px; border-radius: var(--radius-sm); font-weight: 650; font-size: 15px;
  background: var(--accent); color: #fff; width: 100%;
}
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; width: auto; }
.btn-row { display: flex; gap: 8px; margin-top: 14px; }

/* ---- Duplicate warning ---- */
.dupe {
  background: var(--warn-soft); border: 1px solid rgba(154,91,18,.25);
  border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
}
.dupe h3 { font-size: 15px; color: var(--warn); margin-bottom: 4px; }
.dupe p { font-size: 13.5px; color: var(--ink-2); margin: 0 0 12px; }
.match {
  display: flex; gap: 11px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px;
  margin-bottom: 8px;
}
.match .who { flex: 1; min-width: 0; }
.match .nm { font-weight: 650; font-size: 14.5px; }
.match .why { font-size: 12.5px; color: var(--ink-2); }
.match .score { font-size: 11px; font-weight: 700; color: var(--warn);
  background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; }

/* ---- Detail ---- */
.facts { border-top: 1px solid var(--line); margin-top: 6px; }
.fact { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);
  font-size: 14.5px; }
.fact .k { color: var(--ink-3); min-width: 112px; font-size: 13px; }
.fact .v { flex: 1; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface-2);
  font-size: 13px; font-weight: 600; color: var(--ink-2); border: 1px solid transparent; }
.chip.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

/* ---- Gates ---- */
.gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.gate .box { max-width: 420px; width: 100%; text-align: center; }
.gate h1 { font-size: 26px; margin-bottom: 8px; }
.gate p { color: var(--ink-2); margin: 0 0 22px; }
.gate .mark { font-size: 44px; margin-bottom: 14px; }
#gsiButton { display: flex; justify-content: center; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 600; z-index: 90; transition: transform .22s ease;
  max-width: 90vw; text-align: center;
}
.toast.on { transform: translate(-50%, 0); }
.toast.bad { background: var(--danger); color: #fff; }

.spinner {
  width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: grid; place-items: center; padding: 60px 0; color: var(--ink-3); }

.admin-item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px; margin-bottom: 10px;
}
.admin-item .what { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
.admin-item .who { font-size: 12.5px; color: var(--ink-3); margin-bottom: 10px; }
.side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.side { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px; font-size: 13px; }
.side .nm { font-weight: 650; margin-bottom: 4px; }
.side .l { color: var(--ink-3); font-size: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { padding: 10px 12px; font-size: 14px; font-weight: 620; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.nudge {
  background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 13px 15px; margin-top: 16px; display: flex; gap: 11px; align-items: flex-start;
}
.nudge .mk { font-size: 17px; line-height: 1.3; flex: none; }
.nudge .tx { font-size: 13.5px; color: var(--accent-ink); line-height: 1.5; }
.nudge .tx b { font-weight: 700; }

.batch-row { display: grid; grid-template-columns: 24px 1fr 92px 78px; gap: 6px;
  align-items: center; margin-bottom: 6px; }
.batch-row .ord { font-size: 12px; color: var(--ink-3); font-weight: 650; text-align: center; }
.batch-row input, .batch-row select {
  padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); outline: none; min-width: 0;
}
.batch-row input:focus, .batch-row select:focus { border-color: var(--accent); }
@media (max-width: 420px) {
  .batch-row { grid-template-columns: 20px 1fr 76px 66px; gap: 4px; }
  .batch-row input, .batch-row select { padding: 9px 7px; font-size: 14px; }
}
.preview {
  background: var(--accent-soft); color: var(--accent-ink); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 13.5px; font-weight: 600; margin-top: 8px;
  line-height: 1.7;
}
.preview .lbl { display: block; font-size: 11px; letter-spacing: .07em; font-weight: 700;
  text-transform: uppercase; opacity: .7; margin-bottom: 3px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
