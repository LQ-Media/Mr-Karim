<style>
/* Mobile-first: the people who will use this most are relatives on phones in a
   WhatsApp group, not anyone at a desk.

   The palette is pastel green throughout. Every colour is a token defined here
   and redefined once for dark mode, so nothing is hard-coded further down and
   the two themes cannot drift apart. */
:root {
  /* One hue drives the whole palette. Each token keeps its own saturation,
     lightness and small hue offset, so at 140deg this is exactly the pastel
     green it has always been, and any other hue rotates the scheme as a whole
     rather than recolouring one button. Meaning-carrying colours -- warning,
     danger, the two gender tints -- deliberately do not rotate. */
  --hue: 140deg;

  --bg: hsl(calc(var(--hue) - 10deg) 27.3% 95.7%);
  --surface: #ffffff;
  --surface-2: hsl(calc(var(--hue) - 5deg) 28.6% 91.8%);
  --line: hsl(calc(var(--hue) - 2.9deg) 28% 85.3%);
  --line-2: hsl(calc(var(--hue) - 1.8deg) 28.2% 77.1%);
  --ink: hsl(var(--hue) 21.7% 13.5%);
  --ink-2: hsl(calc(var(--hue) - 2deg) 10.5% 37.3%);
  --ink-3: hsl(calc(var(--hue) - 2.5deg) 11.2% 58%);
  --accent: hsl(calc(var(--hue) + 9.6deg) 33% 45.7%);
  --accent-soft: hsl(calc(var(--hue) + 2.9deg) 39.6% 89.6%);
  --accent-ink: hsl(calc(var(--hue) + 9deg) 41.9% 29%);
  --warn: #9a7730;
  --warn-soft: #f7efdc;
  --danger: #a55446;
  --danger-soft: #f8e9e6;
  --male: #e4eff4;
  --male-line: #a7ccd9;
  --male-ink: #3f6d80;
  --female: #f2e9f1;
  --female-line: #ccb3c8;
  --female-ink: #7d5578;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(27,42,32,.05), 0 6px 20px rgba(27,42,32,.07);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
/* Dark twice over: once for a device that asks for it, once for somebody who
   chose it here against a light device. Same tokens both times. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(calc(var(--hue) - 11.4deg) 18.9% 7.3%);
    --surface: hsl(calc(var(--hue) - 6.7deg) 15.8% 11.2%);
    --surface-2: hsl(calc(var(--hue) - 3.6deg) 14.3% 15.1%);
    --line: hsl(calc(var(--hue) - 2.9deg) 13.7% 20%);
    --line-2: hsl(calc(var(--hue) - 2.4deg) 12.4% 26.9%);
    --ink: hsl(calc(var(--hue) - 5deg) 19% 91.8%);
    --ink-2: hsl(calc(var(--hue) - 2deg) 11.6% 66.3%);
    --ink-3: hsl(calc(var(--hue) - 16.7deg) 7.3% 48.6%);
    --accent: hsl(calc(var(--hue) + 6.2deg) 41.1% 62.7%);
    --accent-soft: hsl(calc(var(--hue) + 8deg) 34.9% 16.9%);
    --accent-ink: hsl(calc(var(--hue) + 6.2deg) 44% 75.5%);
    --warn: #cfa863; --warn-soft: #33290f; --danger: #dd8a7d; --danger-soft: #3b201c;
    --male: #1e2b32; --male-line: #3a5765; --male-ink: #9cc2d3;
    --female: #2e2431; --female-line: #54405a; --female-ink: #c9a5c4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
    --bg: hsl(calc(var(--hue) - 11.4deg) 18.9% 7.3%);
    --surface: hsl(calc(var(--hue) - 6.7deg) 15.8% 11.2%);
    --surface-2: hsl(calc(var(--hue) - 3.6deg) 14.3% 15.1%);
    --line: hsl(calc(var(--hue) - 2.9deg) 13.7% 20%);
    --line-2: hsl(calc(var(--hue) - 2.4deg) 12.4% 26.9%);
    --ink: hsl(calc(var(--hue) - 5deg) 19% 91.8%);
    --ink-2: hsl(calc(var(--hue) - 2deg) 11.6% 66.3%);
    --ink-3: hsl(calc(var(--hue) - 16.7deg) 7.3% 48.6%);
    --accent: hsl(calc(var(--hue) + 6.2deg) 41.1% 62.7%);
    --accent-soft: hsl(calc(var(--hue) + 8deg) 34.9% 16.9%);
    --accent-ink: hsl(calc(var(--hue) + 6.2deg) 44% 75.5%);
    --warn: #cfa863; --warn-soft: #33290f; --danger: #dd8a7d; --danger-soft: #3b201c;
    --male: #1e2b32; --male-line: #3a5765; --male-ink: #9cc2d3;
    --female: #2e2431; --female-line: #54405a; --female-ink: #c9a5c4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  font-size: 16px; line-height: 1.5; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
h1,h2,h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }

/* ---- Header ---- */
.topbar {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.topbar .brand { font-weight: 700; font-size: 17px; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The bare round form, still used for the chevron on a card. */
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2); font-size: 16px; flex: none;
  position: relative; border: 1px solid transparent; font-family: var(--font);
}
.icon-btn:hover { border-color: var(--line); }
.icon-btn .dot {
  position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px;
  border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px;
  font-weight: 700; display: grid; place-items: center; padding: 0 4px;
}

/* In the two bars every button says what it is. A row of symbols is a quiz,
   and the people using this are relatives on a phone, not anybody who will
   learn an icon language first. */
.topbar .icon-btn, .maptop .icon-btn {
  width: auto; height: 38px; padding: 0 13px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 7px; font-size: 15px;
}
.topbar .icon-btn .lbl, .maptop .icon-btn .lbl {
  font-size: 12.5px; font-weight: 650; white-space: nowrap;
}
.topbar .icon-btn .dot, .maptop .icon-btn .dot { top: -3px; right: -3px; }

}

/* ---- Search ---- */
.searchbar { padding: 10px 0 4px; }
.searchbar input {
  width: 100%; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); outline: none;
}
.searchbar input:focus { border-color: var(--accent); }

/* ---- Centre card ---- */
.centre {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin: 14px 0 6px;
  display: flex; gap: 14px; align-items: center;
}
.centre .avatar { width: 68px; height: 68px; font-size: 24px; }
.centre .who { min-width: 0; flex: 1; }
.centre .title-badge {
  display: inline-block; background: var(--accent-soft); color: var(--accent-ink);
  border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 650;
  margin-bottom: 4px;
}
.centre .name { font-size: 20px; font-weight: 680; line-height: 1.25; }
.centre .meta { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }

.avatar {
  width: 50px; height: 50px; border-radius: 50%; flex: none; object-fit: cover;
  background: var(--surface-2); display: grid; place-items: center;
  font-weight: 650; color: var(--ink-3); overflow: hidden;
}
.avatar.f { background: var(--female); color: var(--female-ink); }
.avatar.m { background: var(--male); color: var(--male-ink); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ---- Relationship rows ---- */
.section { margin-top: 18px; }
.section-head {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; padding: 0 2px;
}
.section-head h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); font-weight: 700; }
.section-head .add {
  margin-left: auto; font-size: 13px; color: var(--accent); font-weight: 650;
}
.row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px;
  scroll-snap-type: x proximity; }
.row::-webkit-scrollbar { height: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; min-width: 132px; max-width: 132px; text-align: center;
  scroll-snap-align: start; display: flex; flex-direction: column; align-items: center;
  gap: 6px; transition: transform .12s ease, border-color .12s ease;
}
.card:active { transform: scale(.97); }
.card:hover { border-color: var(--accent); }
.card.you { border-color: var(--accent); background: var(--accent-soft); }
.card .ttl { font-size: 13px; font-weight: 700; color: var(--accent-ink); line-height: 1.2; }
.card .nm { font-size: 12.5px; color: var(--ink-2); line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .yr { font-size: 11px; color: var(--ink-3); }
.card.add {
  border-style: dashed; color: var(--ink-3); justify-content: center; min-height: 128px;
}
.card.add .plus { font-size: 26px; line-height: 1; }

.empty { color: var(--ink-3); font-size: 14px; padding: 6px 2px 10px; }

/* ---- Sheet ---- */
.scrim {
  position: fixed; inset: 0; background: rgba(20,17,14,.5); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--surface);
  border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto;
  transform: translateY(101%); transition: transform .24s cubic-bezier(.32,.72,0,1);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 40px rgba(0,0,0,.2);
}
.sheet.on { transform: translateY(0); }
@media (min-width: 720px) {
  .sheet { left: 50%; transform: translate(-50%, 101%); width: 640px;
           border-radius: 20px; bottom: 24px; max-height: 84vh; }
  .sheet.on { transform: translate(-50%, 0); }
}
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line);
  margin: 6px auto 12px; }
.sheet h2 { font-size: 19px; margin-bottom: 4px; }
.sheet .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }

/* ---- Forms ---- */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 650; color: var(--ink-2);
  margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 18px; border-radius: var(--radius-sm); font-weight: 650; font-size: 15px;
  background: var(--accent); color: #fff; width: 100%;
}
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; width: auto; }
.btn-row { display: flex; gap: 8px; margin-top: 14px; }

/* ---- Duplicate warning ---- */
.dupe {
  background: var(--warn-soft); border: 1px solid rgba(154,91,18,.25);
  border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
}
.dupe h3 { font-size: 15px; color: var(--warn); margin-bottom: 4px; }
.dupe p { font-size: 13.5px; color: var(--ink-2); margin: 0 0 12px; }
.match {
  display: flex; gap: 11px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px;
  margin-bottom: 8px;
}
.match .who { flex: 1; min-width: 0; }
.match .nm { font-weight: 650; font-size: 14.5px; }
.match .why { font-size: 12.5px; color: var(--ink-2); }
.match .score { font-size: 11px; font-weight: 700; color: var(--warn);
  background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; }

/* ---- Detail ---- */
.facts { border-top: 1px solid var(--line); margin-top: 6px; }
.fact { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);
  font-size: 14.5px; }
.fact .k { color: var(--ink-3); min-width: 112px; font-size: 13px; }
.fact .v { flex: 1; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface-2);
  font-size: 13px; font-weight: 600; color: var(--ink-2); border: 1px solid transparent; }
.chip.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

/* ---- Gates ---- */
.gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.gate .box { max-width: 420px; width: 100%; text-align: center; }
.gate h1 { font-size: 26px; margin-bottom: 8px; }
.gate p { color: var(--ink-2); margin: 0 0 22px; }
.gate .mark { font-size: 44px; margin-bottom: 14px; }
#gsiButton { display: flex; justify-content: center; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 600; z-index: 90; transition: transform .22s ease;
  max-width: 90vw; text-align: center;
}
.toast.on { transform: translate(-50%, 0); }
.toast.bad { background: var(--danger); color: #fff; }

.spinner {
  width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* An indeterminate bar for the opening wait. There is nothing to measure --
   the server answers when it answers -- so this says "working" without
   pretending to know how far along it is. */
.loadbar {
  width: 190px; height: 4px; margin: 0 auto; border-radius: 999px;
  background: var(--surface-2); overflow: hidden; position: relative;
}
.loadbar::after {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 42%;
  border-radius: 999px; background: var(--accent);
  animation: sweep 1.25s cubic-bezier(.65,.02,.35,1) infinite;
}
@keyframes sweep {
  0%   { transform: translateX(-105%); }
  100% { transform: translateX(345%); }
}
/* Somebody who has asked for less movement still needs to see it is alive. */
@media (prefers-reduced-motion: reduce) {
  .loadbar::after { animation: pulse 1.8s ease-in-out infinite; width: 100%; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
}
.loading { display: grid; place-items: center; padding: 60px 0; color: var(--ink-3); }

/* ---- Colour scheme ---- */

.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 4px; }
.swatch {
  border: 2px solid transparent; background: none; padding: 6px 2px; cursor: pointer;
  border-radius: var(--radius-sm); font: inherit; color: var(--ink-2); font-size: 12px;
  display: grid; justify-items: center; gap: 6px;
}
.swatch .dot {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .55);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
}
.swatch.on { border-color: var(--accent); color: var(--ink); font-weight: 650; }
.swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.modes { display: flex; gap: 8px; margin-top: 6px; }
.modes button {
  flex: 1; padding: 10px; border-radius: var(--radius-sm); font: inherit; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.modes button.on { border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }

/* ---- Reframing a portrait ---- */

/* touch-action:none so a drag pans the photo instead of scrolling the sheet. */
.cropbox {
  position: relative; width: 100%; max-width: 320px; aspect-ratio: 1 / 1;
  margin: 0 auto; border-radius: var(--radius); overflow: hidden;
  background: var(--surface-2); touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.cropbox.dragging { cursor: grabbing; }
.cropbox img {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
  max-width: none; -webkit-user-drag: none; pointer-events: none;
}

/* Cards show portraits in a circle, so the circle is what the guide shows.
   The dimmed corners are still saved -- a profile shows the whole square. */
.cropmask { position: absolute; inset: 0; pointer-events: none; }
.cropmask::before {
  content: ''; position: absolute; inset: 7%; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .9);
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, .38);
}

.cropzoom { display: flex; align-items: center; gap: 10px; margin: 16px auto 0; max-width: 320px; }
.cropzoom input { flex: 1; accent-color: var(--accent); }
.cropzoom .z { color: var(--ink-3); font-size: 17px; line-height: 1; }

.admin-item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px; margin-bottom: 10px;
}
.admin-item .what { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
.admin-item .who { font-size: 12.5px; color: var(--ink-3); margin-bottom: 10px; }
.side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.side { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px; font-size: 13px; }
.side .nm { font-weight: 650; margin-bottom: 4px; }
.side .l { color: var(--ink-3); font-size: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { padding: 10px 12px; font-size: 14px; font-weight: 620; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
/* ---- Whole-tree canvas ---- */
.mapwrap { position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: flex; flex-direction: column; }
.maptop { flex: none; display: flex; gap: 8px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.maptop .ttl { font-weight: 700; font-size: 15px; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage { flex: 1; position: relative; overflow: hidden; background: var(--surface-2);
  touch-action: none; cursor: grab; }
.stage.panning { cursor: grabbing; }
.stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
  background-size: 26px 26px; opacity: .55; }
.world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
#wires { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

.mnode { position: absolute; width: 176px; height: 74px; border-radius: 13px;
  background: var(--surface); border: 1.5px solid var(--line); padding: 8px 10px;
  display: flex; flex-direction: column; justify-content: center; cursor: grab;
  user-select: none; -webkit-user-select: none;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.05); }
.mnode.m { background: var(--male); border-color: var(--male-line); }
.mnode.f { background: var(--female); border-color: var(--female-line); }
.mnode.you { border-color: var(--accent); border-width: 2.5px; background: var(--accent-soft); }
.mnode.dragging { cursor: grabbing; box-shadow: 0 8px 28px rgba(0,0,0,.22); z-index: 10; }
.mnode.lit { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.mnode.dim { opacity: .3; }
.mnode .t { font-size: 12px; font-weight: 700; color: var(--accent-ink); line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnode .n { font-size: 12.5px; font-weight: 600; line-height: 1.2; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnode .y { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.mapfoot { flex: none; border-top: 1px solid var(--line); background: var(--surface);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: center; min-height: 56px; }
.mapfoot .who { flex: 1; min-width: 0; }
.mapfoot .nm { font-weight: 650; font-size: 14.5px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.mapfoot .sub2 { font-size: 12.5px; color: var(--ink-2); }

.nudge {
  background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 13px 15px; margin-top: 16px; display: flex; gap: 11px; align-items: flex-start;
