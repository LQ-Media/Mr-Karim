      'English has no word for it and borrows brother-in-law.';
  } else if (rel.kind === 'in_law' && rel.direction === 'co_parent_in_law') {
    why = 'Your child married theirs. Malay calls this <b>besan</b>.';
  } else if (rel.kind === 'blood' && rel.type === 'cousin' && rel.linkAuncle) {
    why = 'Descends from ' + shortName(rel.linkAuncle.display_name).split(' ')[0] +
      '. Arabic names cousins after that person, so the word carries which side.';
  } else if (rel.kind === 'blood' && rel.type === 'sibling') {
    why = rel.elder ? 'Older than ' + me + ' — Malay grades siblings by seniority.'
                    : 'Younger than ' + me + '.';
  } else {
    why = 'Born ' + String(p.birth_date).slice(0, 4) + '. ' +
      TTL_title(graph, state.ego, id, 'en', SETTINGS).label + ' in English.';
  }

  strip.innerHTML =
    '<span class="badge' + (ar ? ' ar' : '') + '">' + esc(ar ? t.script : t.label) + '</span>' +
    '<div class="who"><div class="nm">' + esc(shortName(p.display_name)) + '</div>' +
    '<div class="why">' + why + '</div></div>';
}

/* ---------- interaction ---------- */

var drag = null, pan = null, pinch = null;

document.getElementById('stage').addEventListener('pointerdown', function(e){
  // The legend has said its piece once somebody starts moving things about.
  var legend = document.querySelector('.legend');
  if (legend) legend.classList.add('gone');

  var node = e.target.closest('.node');
  if (node) {
    drag = {
      id: node.dataset.id, pointer: e.pointerId,
      dx: e.clientX / state.scale - pos[node.dataset.id].x,
      dy: e.clientY / state.scale - pos[node.dataset.id].y,
      moved: false
    };
    node.classList.add('dragging');
    node.setPointerCapture(e.pointerId);
    return;
  }
  pan = { x: e.clientX - state.tx, y: e.clientY - state.ty, pointer: e.pointerId };
  this.classList.add('panning');
  this.setPointerCapture(e.pointerId);
});

document.getElementById('stage').addEventListener('pointermove', function(e){
  if (drag && e.pointerId === drag.pointer) {
    pos[drag.id].x = e.clientX / state.scale - drag.dx;
    pos[drag.id].y = e.clientY / state.scale - drag.dy;
    drag.moved = true;
    nodeEls[drag.id].style.left = (pos[drag.id].x - M.NODE_W / 2) + 'px';
    nodeEls[drag.id].style.top  = (pos[drag.id].y - M.NODE_H / 2) + 'px';
    drawWires();
    return;
  }
  if (pan && e.pointerId === pan.pointer) {
    state.tx = e.clientX - pan.x;
    state.ty = e.clientY - pan.y;
    applyTransform();
  }
});

function endPointer(e) {
  if (drag && e.pointerId === drag.pointer) {
    nodeEls[drag.id].classList.remove('dragging');
    if (!drag.moved) {
      state.selected = state.selected === drag.id ? null : drag.id;
      highlight(); drawWires(); describe(state.selected);
    } else {
      savePositions();
    }
    drag = null;
  }
  if (pan && e.pointerId === pan.pointer) {
    pan = null;
    document.getElementById('stage').classList.remove('panning');
  }
}
document.getElementById('stage').addEventListener('pointerup', endPointer);
document.getElementById('stage').addEventListener('pointercancel', endPointer);

document.getElementById('stage').addEventListener('wheel', function(e){
  e.preventDefault();
  var rect = this.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var factor = Math.exp(-e.deltaY * 0.0015);
  var next = Math.max(0.12, Math.min(2.2, state.scale * factor));
  state.tx = mx - (mx - state.tx) * (next / state.scale);
  state.ty = my - (my - state.ty) * (next / state.scale);
  state.scale = next;
  applyTransform();
}, { passive: false });

// Pinch, for phones.
var touches = {};
document.getElementById('stage').addEventListener('touchstart', function(e){
  if (e.touches.length === 2) {
    pinch = {
      dist: touchDistance(e.touches),
      scale: state.scale,
      cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      cy: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      tx: state.tx, ty: state.ty
    };
    drag = null; pan = null;
  }
}, { passive: true });

document.getElementById('stage').addEventListener('touchmove', function(e){
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    var rect = this.getBoundingClientRect();
    var ratio = touchDistance(e.touches) / pinch.dist;
    var next = Math.max(0.12, Math.min(2.2, pinch.scale * ratio));
    var mx = pinch.cx - rect.left, my = pinch.cy - rect.top;
    state.tx = mx - (mx - pinch.tx) * (next / pinch.scale);
    state.ty = my - (my - pinch.ty) * (next / pinch.scale);
    state.scale = next;
    applyTransform();
  }
}, { passive: false });

document.getElementById('stage').addEventListener('touchend', function(e){
  if (e.touches.length < 2) pinch = null;
}, { passive: true });

function touchDistance(t) {
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy) || 1;
}

document.addEventListener('click', function(e){
  var ego = e.target.closest('[data-ego]');
  if (ego) {
    state.ego = ego.dataset.ego;
    drawChips(); paintNodes(); describe(state.selected);
    // Move to whoever is now reading, or the labels change under a part of the
    // chart they are not even looking at.
    if (state.scale >= LEGIBLE) focusOn(state.ego);
    return;
  }
  var lang = e.target.closest('[data-lang]');
  if (lang) { state.lang = lang.dataset.lang; drawChips(); paintNodes(); describe(state.selected); return; }
  if (e.target.id === 'fit') fit();
  if (e.target.id === 'me') focusOn(state.ego, Math.max(state.scale, 0.92));
  if (e.target.id === 'arrange') {
    resetPositions(); savePositions(); placeNodes(); openingView();
  }
});

window.addEventListener('resize', function(){ drawWires(); });

/* ---------- start ---------- */

resetPositions();
loadPositions();
drawChips();
buildNodes();
describe(null);
document.getElementById('subtitle').textContent =
  'Salim family · ' + Object.keys(graph.people).length + ' people · three generations';
requestAnimationFrame(openingView);
</script>
