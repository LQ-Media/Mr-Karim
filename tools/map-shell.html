<title>Salim Family Map</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Pastel green throughout. Every colour is a token here, redefined once
   for dark mode and once again for an explicit dark choice, so nothing is
   hard-coded further down and the themes cannot drift apart. */
:root{
  --paper:#f1f7f2; --surface:#ffffff; --sunk:#e4f0e7; --canvas:#eaf4ed;
  --ink:#1b2a20; --ink-2:#55695b; --ink-3:#88a08f;
  --line:#cfe4d5; --line-2:#b4d5be;
  --pine:#4e9b74; --pine-soft:#daefe2; --pine-ink:#2b6949;
  --brass:#9a7730; --brass-soft:#f7efdc;
  --rose:#7d5578; --rose-soft:#f2e9f1; --rose-line:#ccb3c8;
  --blue:#3f6d80; --blue-soft:#e4eff4; --blue-line:#a7ccd9;
  --wire:#9dbda8; --wire-strong:#4e9b74;
  --display:"Fraunces",Georgia,serif;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --arabic:"Amiri","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1610; --surface:#18211a; --sunk:#212c24; --canvas:#131b15;
  --ink:#e6eee8; --ink-2:#9fb3a5; --ink-3:#738574;
  --line:#2c3a30; --line-2:#3c4d41;
  --pine:#79c79b; --pine-soft:#1c3a2a; --pine-ink:#a5dcbd;
  --brass:#cfa863; --brass-soft:#33290f;
  --rose:#c9a5c4; --rose-soft:#2e2431; --rose-line:#54405a;
  --blue:#9cc2d3; --blue-soft:#1e2b32; --blue-line:#3a5765;
  --wire:#3f5446; --wire-strong:#79c79b;
}}
:root[data-theme="dark"]{
  --paper:#0f1610; --surface:#18211a; --sunk:#212c24; --canvas:#131b15;
  --ink:#e6eee8; --ink-2:#9fb3a5; --ink-3:#738574;
  --line:#2c3a30; --line-2:#3c4d41;
  --pine:#79c79b; --pine-soft:#1c3a2a; --pine-ink:#a5dcbd;
  --brass:#cfa863; --brass-soft:#33290f;
  --rose:#c9a5c4; --rose-soft:#2e2431; --rose-line:#54405a;
  --blue:#9cc2d3; --blue-soft:#1e2b32; --blue-line:#3a5765;
  --wire:#3f5446; --wire-strong:#79c79b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
h1{margin:0}

.bar{flex:none;padding:12px 16px 10px;border-bottom:1px solid var(--line);
  background:var(--paper);z-index:3}
.tool .sm{display:none}
@media (max-width:560px){
  .bar{padding:10px 16px 8px}
  .bar h1{font-size:17px;white-space:nowrap}
  /* The count is pleasant, not necessary. Dropping it keeps the title and the
     three controls on one line, which buys back a row of the chart. */
  .bar .sub{display:none}
  .tool{padding:5px 10px;font-size:12px}
  .tool .lg{display:none}
  .tool .sm{display:inline}
}
.bar h1{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.bar .sub{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.titlerow{display:flex;align-items:flex-start;gap:8px}
.titles{flex:1;min-width:0}
/* The control rows scroll sideways rather than wrapping. On a phone, wrapping
   pushed the chart itself off the bottom of the screen. */
.ctrls{display:flex;gap:6px;align-items:center;margin-top:9px;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  padding-bottom:1px;-webkit-overflow-scrolling:touch}
.ctrls::-webkit-scrollbar{display:none}
.ctrls .lab{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-right:2px}
.chip{padding:5px 11px;border-radius:999px;background:var(--sunk);font-size:12.5px;
  font-weight:500;color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--pine-soft);color:var(--pine-ink);
  border-color:var(--pine);font-weight:650}
.spacer{flex:1;min-width:8px}
.tool{padding:5px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:550;color:var(--ink-2);white-space:nowrap}
.tool:hover{border-color:var(--pine);color:var(--pine-ink)}

/* ---- Canvas ---- */
.stage{flex:1;position:relative;overflow:hidden;background:var(--canvas);
  touch-action:none;cursor:grab}
.stage.panning{cursor:grabbing}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);
  background-size:26px 26px;opacity:.5}
.world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

.node{position:absolute;width:196px;height:74px;border-radius:13px;
  background:var(--surface);border:1.5px solid var(--line-2);
  padding:8px 10px;display:flex;gap:9px;align-items:center;
  cursor:grab;user-select:none;-webkit-user-select:none;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.05);
  transition:box-shadow .15s,border-color .15s}
.node .face{width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;
  display:grid;place-items:center;font-size:13px;font-weight:700;
  background:var(--sunk);color:var(--ink-3)}
.node.m .face{background:var(--blue-soft);color:var(--blue)}
.node.f .face{background:var(--rose-soft);color:var(--rose)}
.node .face img{width:100%;height:100%;object-fit:cover;display:block}
.node .text{min-width:0;flex:1}
.node.m{border-color:var(--blue-line);background:var(--blue-soft)}
.node.f{border-color:var(--rose-line);background:var(--rose-soft)}
.node.dragging{cursor:grabbing;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:10}
.node.you{border-color:var(--pine);border-width:2.5px;background:var(--pine-soft)}
.node.lit{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.node.dim{opacity:.32}
.node .ttl{font-size:12px;font-weight:700;color:var(--pine-ink);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .ttl.ar{font-family:var(--arabic);font-size:15px;font-weight:400}
.node .nm{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .yr{font-size:10.5px;color:var(--ink-3);margin-top:1px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---- Detail strip ---- */
.strip{flex:none;border-top:1px solid var(--line);background:var(--surface);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:12px;align-items:center;min-height:62px}
.strip .who{flex:1;min-width:0}
.strip .nm{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .why{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.strip .why b{color:var(--ink);font-weight:650}
.strip .why .ar{font-family:var(--arabic);font-size:15px}
.strip .act{flex:none;padding:8px 12px;border-radius:9px;background:var(--sunk);
  font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.strip .act:hover{color:var(--pine-ink);background:var(--pine-soft)}
.strip .badge{background:var(--pine-soft);color:var(--pine-ink);border-radius:999px;
  padding:4px 12px;font-size:13px;font-weight:700;flex:none;white-space:nowrap}
.strip .badge.ar{font-family:var(--arabic);font-size:16px;font-weight:400;padding:2px 12px}
.strip .hint{font-size:12.5px;color:var(--ink-3)}

/* ---- Add / edit dialog ---- */
.scrim{position:fixed;inset:0;background:rgba(18,30,22,.5);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.dialog{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(440px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  box-shadow:0 20px 60px rgba(18,30,22,.28)}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h2{font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:3px}
.dialog .sub{font-size:13px;color:var(--ink-2);margin-bottom:15px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:650;color:var(--ink-3);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:10px 12px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--pine);
  box-shadow:0 0 0 3px var(--pine-soft)}
.fld .note{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel button{padding:8px 13px;border-radius:9px;background:var(--sunk);font-size:13px;
  font-weight:550;color:var(--ink-2);border:1px solid transparent}
.rel button[aria-pressed="true"]{background:var(--pine-soft);color:var(--pine-ink);
  border-color:var(--pine);font-weight:650}
.go{width:100%;padding:12px;border-radius:11px;background:var(--pine);color:#fff;
  font-weight:650;font-size:15px}
.go.ghost{background:var(--sunk);color:var(--ink)}
.go:disabled{opacity:.45}
.rowbtn{display:flex;gap:8px;margin-top:6px}
.maybe{background:var(--brass-soft);border:1px solid rgba(154,119,48,.3);border-radius:12px;
  padding:12px;margin-bottom:13px}
.maybe h3{font-size:13.5px;color:var(--brass);margin-bottom:3px}
.maybe p{font-size:12.5px;color:var(--ink-2);margin:0 0 9px}
.maybe button{display:flex;width:100%;gap:9px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;margin-bottom:6px;font-size:13px}
.maybe button b{font-weight:650}
.maybe .pc{margin-left:auto;font-size:11px;font-weight:700;color:var(--brass);flex:none}

/* Informational only -- it must never swallow a tap meant for a card. */
.toast{pointer-events:none;position:fixed;left:50%;bottom:86px;transform:translate(-50%,24px);z-index:60;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;
  font-size:13.5px;font-weight:600;max-width:88vw;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

.legend{transition:opacity .3s;position:absolute;left:12px;bottom:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:11px;
  color:var(--ink-2);display:flex;gap:14px;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid var(--wire);
  vertical-align:middle;margin-right:5px}
.legend i.mar{border-top-style:solid;border-color:var(--brass);border-top-width:3px}
.legend.gone{opacity:0}
@media (max-width:520px){ .legend{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar">
  <div class="titlerow">
    <div class="titles">
      <h1>Pokok Keluarga</h1>
      <div class="sub" id="subtitle">Salim family</div>
    </div>
    <button class="tool" id="add"><span class="lg">+ Add person</span><span class="sm">+ Add</span></button>
    <button class="tool" id="me"><span class="lg">Find me</span><span class="sm">Me</span></button>
    <button class="tool" id="fit"><span class="lg">Whole tree</span><span class="sm">All</span></button>
    <button class="tool" id="arrange"><span class="lg">Re-arrange</span><span class="sm">Tidy</span></button>
  </div>
  <div class="ctrls">
    <span class="lab">As</span>
    <span id="egoChips" style="display:contents"></span>
  </div>
  <div class="ctrls">
    <span class="lab">In</span>
    <button class="chip" data-lang="ms">Melayu</button>
    <button class="chip" data-lang="en">English</button>
    <button class="chip" data-lang="ar">Arabic</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="world" id="world">
    <svg id="wires"></svg>
  </div>
  <div class="legend">
    <span><i class="mar"></i>marriage</span>
    <span><i></i>descent</span>
    <span>drag a card &middot; pinch or scroll to zoom</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="dialog" id="dialog"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<div class="strip" id="strip">
  <div class="who"><div class="nm">Tap a card</div>
  <div class="why">Tap someone to add their photo or a relative.</div></div>
</div>

<script>
var SETTINGS = { birth_order_titles: 'Long,Ngah,Alang,Anjang,Andak,Uda,Uteh' };

/* The family is mutable here: people added in the prototype go into the same
   arrays the engine reads, so a new relative is related to everybody else by
   the same code that labels the originals. Nothing leaves the browser. */
var DATA = JSON.parse(JSON.stringify(FAMILY));
var graph, layout, M;
var PAD = 90;
var photos = {};

function rebuild() {
  graph = REL_buildGraph(DATA);
  layout = LAY_compute(graph, {});
  M = layout.metrics;
}
rebuild();

var state = { ego: 'S04', lang: 'ms', selected: null, scale: 1, tx: 0, ty: 0 };
var pos = {};           // Live card centres, in world coordinates.
var nodeEls = {};

var READERS = [
  ['S04', 'Karim'], ['S11', 'Aqilah'], ['S01', 'Atok Salim'],
  ['S03', "Su'aidah"], ['S18', 'Umar']
];

var STORE_KEY = 'pokokPositions.v2';
var PEOPLE_KEY = 'pokokPeople.v1';
var PHOTO_KEY = 'pokokPhotos.v1';

/* ---------- positions ---------- */

function resetPositions() {
  pos = {};
  for (var id in layout.nodes) {
    if (id === '__partners' || !layout.nodes.hasOwnProperty(id)) continue;
    pos[id] = {
      x: layout.nodes[id].x - layout.bounds.minX + PAD,
      y: layout.nodes[id].y - layout.bounds.minY + PAD
    };
  }
}

/* Everything the prototype remembers lives in this browser and nowhere else.
   Each read and write is guarded, and the page renders correctly when none of
   it comes back -- a private window, cleared site data, a preview. */
function savePositions() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(pos)); } catch (e) {}
}

function saveAdditions() {
  try {
    localStorage.setItem(PEOPLE_KEY, JSON.stringify({
      people: DATA.people.filter(function (p) { return p.added; }),
      parentage: DATA.parentage.filter(function (l) { return l.added; }),
      unions: DATA.unions.filter(function (u) { return u.added; })
    }));
  } catch (e) {}
}

function loadAdditions() {
  try {
    var raw = localStorage.getItem(PEOPLE_KEY);
    if (!raw) return false;
    var saved = JSON.parse(raw);
    if (!saved || !saved.people) return false;
    DATA.people = DATA.people.concat(saved.people);
    DATA.parentage = DATA.parentage.concat(saved.parentage || []);
    DATA.unions = DATA.unions.concat(saved.unions || []);
    rebuild();
    return true;
  } catch (e) { return false; }
}

function savePhotos() {
  try { localStorage.setItem(PHOTO_KEY, JSON.stringify(photos)); } catch (e) {
    toastMsg('That photo was too big to keep in this browser.');
  }
}

function loadPhotos() {
  try {
    var raw = localStorage.getItem(PHOTO_KEY);
    if (raw) photos = JSON.parse(raw) || {};
  } catch (e) { photos = {}; }
}
function loadPositions() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    var saved = JSON.parse(raw);
    var count = 0;
    for (var id in pos) {
      if (pos.hasOwnProperty(id) && saved[id] &&
          typeof saved[id].x === 'number' && typeof saved[id].y === 'number') {
        pos[id] = { x: saved[id].x, y: saved[id].y };
        count++;
      }
    }
    return count > 0;
  } catch (e) { return false; }
}

/* ---------- drawing ---------- */

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shortName(full){
  var parts = String(full).split(' ');
  var stop = parts.findIndex(function(w){ return /^(BIN|BINTE|BINTI|BTE|BT)$/i.test(w); });
  var own = stop > 0 ? parts.slice(0, stop) : parts.slice(0, 2);
  return own.map(function(w){ return w.charAt(0) + w.slice(1).toLowerCase(); }).join(' ');
}
function titleFor(id){ return TTL_title(graph, state.ego, id, state.lang, SETTINGS); }

function gcls(g){ return g === 'F' ? 'f' : (g === 'M' ? 'm' : ''); }

/** Shown on a card until somebody adds a photograph. */
function initials(name){
  var parts = String(name || '?').trim().split(/\s+/);
  var first = parts[0] ? parts[0][0] : '?';
  var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (first + last).toUpperCase();
}

function buildNodes() {
  var world = document.getElementById('world');
  Array.prototype.slice.call(world.querySelectorAll('.node')).forEach(function(n){ n.remove(); });
  nodeEls = {};

  for (var id in pos) {
    if (!pos.hasOwnProperty(id)) continue;
    var p = graph.people[id];
    var el = document.createElement('div');
    el.className = 'node ' + gcls(p.gender);
    el.dataset.id = id;
    world.appendChild(el);
    nodeEls[id] = el;
  }
  paintNodes();
  placeNodes();
}

function paintNodes() {
  for (var id in nodeEls) {
    if (!nodeEls.hasOwnProperty(id)) continue;
    var p = graph.people[id];
    var t = titleFor(id);
    var you = id === state.ego;
    var ar = state.lang === 'ar' && t.script;
    var label = you ? (state.lang === 'en' ? 'You' : state.lang === 'ar' ? '\u0623\u0646\u0627' : 'Saya')
                    : (ar ? t.script : t.label);

    nodeEls[id].innerHTML =
      face(id, p) +
      '<div class="text">' +
        '<div class="tt' + (ar || (you && state.lang === 'ar') ? ' ar' : '') + '">' +
          esc(label) + '</div>' +
        '<div class="nm">' + esc(shortName(p.display_name)) + '</div>' +
        '<div class="yr">' + esc(String(p.birth_date || '').slice(0, 4)) + '</div>' +
      '</div>';

    nodeEls[id].className = 'node ' + gcls(p.gender) + (you ? ' you' : '');
  }
  highlight();
}

function face(id, p) {
  return '<div class="face">' +
    (photos[id] ? '<img src="' + photos[id] + '" alt="">' : esc(initials(p.display_name))) +
    '</div>';
}

function placeNodes() {
  for (var id in nodeEls) {
    if (!nodeEls.hasOwnProperty(id)) continue;
    nodeEls[id].style.left = (pos[id].x - M.NODE_W / 2) + 'px';
    nodeEls[id].style.top  = (pos[id].y - M.NODE_H / 2) + 'px';
  }
  drawWires();
}

/**
 * The lines are rebuilt from wherever the cards are right now, which is what
 * lets a dragged card take its connections with it without anything being
 * recalculated or invalidated.
 */
function drawWires() {
  var edges = LAY_edges(layout.units, pos, M);
  var maxX = 0, maxY = 0;
  for (var id in pos) {
    if (!pos.hasOwnProperty(id)) continue;
    maxX = Math.max(maxX, pos[id].x + M.NODE_W);
    maxY = Math.max(maxY, pos[id].y + M.NODE_H);
  }

  var parts = ['<defs>' +
    '<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" ' +
      'orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--wire)"/></marker>' +
    '<marker id="arLit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" ' +
      'orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--wire-strong)"/></marker>' +
    '</defs>'];

  var near = neighbourhood();

  for (var i = 0; i < edges.length; i++) {
    var e = edges[i];
    var lit = near && ((e.childId && near[e.childId]) ||
      (e.kind === 'union' && near.__union && near.__union[e.unionId]));
    var stroke = lit ? 'var(--wire-strong)' : 'var(--wire)';
    var width = lit ? 2.4 : 1.6;
    var fade = near && !lit ? ' opacity="0.3"' : '';

    if (e.kind === 'union') {
      parts.push('<path d="M ' + e.x1 + ' ' + e.y1 + ' L ' + e.x2 + ' ' + e.y2 +
        '" stroke="' + (lit ? 'var(--brass)' : 'var(--brass)') + '" stroke-width="' +
        (lit ? 3.4 : 2.4) + '" fill="none" stroke-linecap="round"' + fade + '/>');
      parts.push('<circle cx="' + e.midX + '" cy="' + e.midY + '" r="' + (lit ? 5 : 4) +
        '" fill="var(--brass)"' + fade + '/>');
    } else if (e.kind === 'stem') {
      parts.push('<path d="M ' + e.x1 + ' ' + e.y1 + ' L ' + e.x2 + ' ' + e.y2 +
        '" stroke="' + stroke + '" stroke-width="' + width + '" fill="none"' + fade + '/>');
    } else {
      parts.push('<path d="' + LAY_descentPath(e, 12) + '" stroke="' + stroke +
        '" stroke-width="' + width + '" fill="none" stroke-linejoin="round" ' +
        'marker-end="url(#' + (lit ? 'arLit' : 'ar') + ')"' + fade + '/>');
    }
  }

  var svg = document.getElementById('wires');
  svg.setAttribute('width', maxX + PAD);
  svg.setAttribute('height', maxY + PAD);
  svg.innerHTML = parts.join('');
}

/** Everyone directly connected to the selected card, for dimming the rest. */
function neighbourhood() {
  if (!state.selected) return null;
  var near = {};
  near[state.selected] = true;
  near.__union = {};

  KIN_parentsOf(graph, state.selected).forEach(function(id){ near[id] = true; });
  KIN_childrenOf(graph, state.selected).forEach(function(id){ near[id] = true; });
  KIN_spousesOf(graph, state.selected).forEach(function(s){
    near[s.personId] = true;
    near.__union[s.union.union_id] = true;
  });
  // A child's line is lit when either the child or one of its parents is chosen.
  layout.units.forEach(function(u){
    if (u.partners.indexOf(state.selected) !== -1) {
      u.children.forEach(function(c){ near[c] = true; });
      if (u.union) near.__union[u.union.union_id] = true;
    }
  });
  return near;
}

function highlight() {
  var near = neighbourhood();
  for (var id in nodeEls) {
    if (!nodeEls.hasOwnProperty(id)) continue;
    nodeEls[id].classList.toggle('lit', !!(near && id === state.selected));
    nodeEls[id].classList.toggle('dim', !!(near && !near[id]));
  }
}

/* ---------- controls ---------- */

function drawChips() {
  document.getElementById('egoChips').innerHTML = READERS.map(function(r){
    return '<button class="chip" data-ego="' + r[0] + '" aria-pressed="' +
      (state.ego === r[0]) + '">' + esc(r[1]) + '</button>';
  }).join('');
  Array.prototype.slice.call(document.querySelectorAll('[data-lang]')).forEach(function(b){
    b.setAttribute('aria-pressed', String(state.lang === b.dataset.lang));
  });
}

function applyTransform() {
  document.getElementById('world').style.transform =
    'translate(' + state.tx + 'px,' + state.ty + 'px) scale(' + state.scale + ')';
}

/* Below about this, the names on the cards stop being readable and the chart
   becomes a diagram of itself. */
var LEGIBLE = 0.62;

function contentBox() {
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (var id in pos) {
    if (!pos.hasOwnProperty(id)) continue;
    minX = Math.min(minX, pos[id].x - M.NODE_W / 2);
    minY = Math.min(minY, pos[id].y - M.NODE_H / 2);
    maxX = Math.max(maxX, pos[id].x + M.NODE_W / 2);
    maxY = Math.max(maxY, pos[id].y + M.NODE_H / 2);
  }
  return { minX: minX, minY: minY, maxX: maxX, maxY: maxY,
           w: maxX - minX + 48, h: maxY - minY + 48 };
}

/** The whole chart at once, however small that has to be. */
function fit() {
  var stage = document.getElementById('stage');
  var box = contentBox();
  state.scale = Math.max(0.14, Math.min(1.15,
    Math.min(stage.clientWidth / box.w, stage.clientHeight / box.h)));
  state.tx = (stage.clientWidth - box.w * state.scale) / 2 - (box.minX - 24) * state.scale;
  state.ty = (stage.clientHeight - box.h * state.scale) / 2 - (box.minY - 24) * state.scale;
  applyTransform();
}

/** One person, centred, at a size their name can actually be read at. */
function focusOn(id, scale) {
  var stage = document.getElementById('stage');
  if (!pos[id]) return fit();
  state.scale = scale || Math.max(state.scale, LEGIBLE);
  state.tx = stage.clientWidth / 2 - pos[id].x * state.scale;
  state.ty = stage.clientHeight / 2 - pos[id].y * state.scale;
  applyTransform();
}

/**
 * What to show on opening.
 *
 * Fitting eighteen people across three generations onto a phone leaves the
 * names too small to read, so the chart opens on whoever is reading it and
 * keeps the overview as a button. On a wide screen the whole thing fits
 * legibly, so it starts there.
 */
function openingView() {
  var stage = document.getElementById('stage');
  var box = contentBox();
  var fitScale = Math.min(stage.clientWidth / box.w, stage.clientHeight / box.h);

  // On a wide screen the shape of the family is worth seeing even when the
  // names get small -- you can zoom. On a phone the same view is just a diagram
  // of a diagram, so it opens on the reader instead.
  var floor = stage.clientWidth >= 700 ? 0.34 : LEGIBLE;
  if (fitScale >= floor) fit();
  else focusOn(state.ego, 0.92);
}

function describe(id) {
  var strip = document.getElementById('strip');
  if (!id) {
    strip.innerHTML = '<div class="who"><div class="nm">Tap a card</div>' +
      '<div class="why">Tap someone to add their photo or a relative. Drag cards to ' +
      'rearrange, and change who is reading above.</div></div>' +
      '<button class="act" id="stripAdd">+ Add person</button>';
    return;
  }
  var p = graph.people[id];
  var t = titleFor(id);
  var ar = state.lang === 'ar' && t.script;
  var rel = KIN_relate(graph, state.ego, id);
  var me = shortName(graph.people[state.ego].display_name).split(' ')[0];

  var why;
  if (id === state.ego) {
    why = 'This is you. Every label on the chart is worked out from here.';
  } else if (rel.kind === 'blood' && rel.type === 'auncle' && rel.birthOrder) {
    why = '<b>' + rel.birthOrder + ' of ' + rel.siblingCount + '</b> among their own ' +
      'siblings, which is what picks the Malay word — and on your ' +
      (rel.side === 'maternal' ? 'mother’s' : 'father’s') +
      ' side, which is what picks the Arabic one.';
  } else if (rel.kind === 'in_law' && rel.direction === 'spouse_of_spouses_relative') {
    why = 'Married to ' + me + '’s sibling. Malay calls this <b>biras</b>; ' +
      'English has no word for it and borrows brother-in-law.';
  } else if (rel.kind === 'in_law' && rel.direction === 'co_parent_in_law') {
    why = 'Your child married theirs. Malay calls this <b>besan</b>.';
  } else if (rel.kind === 'blood' && rel.type === 'cousin' && rel.linkAuncle) {
    why = 'Descends from ' + shortName(rel.linkAuncle.display_name).split(' ')[0] +
      '. Arabic names cousins after that person, so the word carries which side.';
  } else if (rel.kind === 'blood' && rel.type === 'sibling') {
    why = rel.elder ? 'Older than ' + me + ' — Malay grades siblings by seniority.'
                    : 'Younger than ' + me + '.';
  } else {
    why = 'Born ' + String(p.birth_date).slice(0, 4) + '. ' +
      TTL_title(graph, state.ego, id, 'en', SETTINGS).label + ' in English.';
  }

  strip.innerHTML =
    '<span class="badge' + (ar ? ' ar' : '') + '">' + esc(ar ? t.script : t.label) + '</span>' +
    '<div class="who"><div class="nm">' + esc(shortName(p.display_name)) + '</div>' +
    '<div class="why">' + why + '</div></div>' +
    '<button class="act" data-photo="' + id + '">' +
      (photos[id] ? 'Change photo' : 'Add photo') + '</button>' +
    '<button class="act" data-relative="' + id + '">+ Relative</button>';
}

/* ---------- adding people ---------- */

var REL_WORDS = {
  child_of:  { label: 'Child of',   becomes: 'a son or daughter of' },
  parent_of: { label: 'Parent of',  becomes: 'a parent of' },
  spouse_of: { label: 'Married to', becomes: 'married to' },
  sibling_of:{ label: 'Sibling of', becomes: 'a brother or sister of' }
};

var draft = { anchor: null, rel: 'child_of' };

function openDialog(html) {
  var d = document.getElementById('dialog');
  d.innerHTML = html;
  d.classList.add('on');
  document.getElementById('scrim').classList.add('on');
}

function closeDialog() {
  document.getElementById('dialog').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

function toastMsg(text) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast on';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.className = 'toast'; }, 3200);
}

/**
 * Adding somebody to the chart.
 *
 * Nobody is added on their own. The first thing the form asks is who they are
 * related to and how, because a person with no connection is how a family tree
 * quietly splits into two halves that never meet again. The anchor defaults to
 * whichever card is selected, so adding a child to the person you are looking
 * at takes one tap and two fields.
 */
function openAddPerson(anchorId) {
  var ids = Object.keys(graph.people).sort(function (a, b) {
    return graph.people[a].display_name.localeCompare(graph.people[b].display_name);
  });
  draft.anchor = anchorId || state.selected || state.ego;

  openDialog(
    '<h2>Add someone</h2>' +
    '<div class="sub">Everyone is added through a person already on the chart, ' +
      'so the family stays in one piece.</div>' +
    '<div id="dupeZone"></div>' +
    '<div class="fld"><label>Related to</label>' +
      '<select id="a_anchor">' + ids.map(function (id) {
        return '<option value="' + id + '"' + (id === draft.anchor ? ' selected' : '') + '>' +
          esc(shortName(graph.people[id].display_name)) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="fld"><label>As their</label><div class="rel" id="a_rel">' +
      Object.keys(REL_WORDS).map(function (key) {
        return '<button data-rel="' + key + '" aria-pressed="' + (draft.rel === key) + '">' +
          REL_WORDS[key].label + '</button>';
      }).join('') + '</div><div class="note" id="a_hint"></div></div>' +
    '<div class="fld"><label>Full name</label>' +
      '<input id="a_name" placeholder="e.g. Aisyah binti Salim" maxlength="120" autocomplete="off">' +
      '<div class="note">Writing bin or binti helps the app spot duplicates.</div></div>' +
    '<div class="two">' +
      '<div class="fld"><label>Gender</label><select id="a_gender">' +
        '<option value="">Not recorded</option><option value="M">Male</option>' +
        '<option value="F">Female</option></select></div>' +
      '<div class="fld"><label>Born</label>' +
        '<input id="a_year" type="number" min="1800" max="2100" placeholder="Year"></div>' +
    '</div>' +
    '<div class="rowbtn"><button class="go" id="a_go">Add to the chart</button>' +
    '<button class="go ghost" id="a_cancel" style="width:auto;padding:12px 16px">Cancel</button></div>');

  function refreshHint() {
    var person = graph.people[document.getElementById('a_anchor').value];
    var typed = (document.getElementById('a_name').value || '').trim();
    document.getElementById('a_hint').textContent =
      (typed ? shortName(typed) : 'This person') + ' will be recorded as ' +
      REL_WORDS[draft.rel].becomes + ' ' + shortName(person.display_name) + '.';
  }

  document.querySelectorAll('#a_rel button').forEach(function (b) {
    b.onclick = function () {
      draft.rel = b.dataset.rel;
      document.querySelectorAll('#a_rel button').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o.dataset.rel === draft.rel));
      });
      refreshHint();
    };
  });
  document.getElementById('a_anchor').onchange = refreshHint;
  refreshHint();

  // Look for somebody this might already be, while they type.
  var nameEl = document.getElementById('a_name');
  nameEl.oninput = function () { refreshHint(); checkForDuplicate(nameEl.value); };
  nameEl.focus();

  document.getElementById('a_cancel').onclick = closeDialog;
  document.getElementById('a_go').onclick = function () {
    var name = nameEl.value.trim();
    if (!name) return toastMsg('Give them a name first.');
    addPerson(document.getElementById('a_anchor').value, draft.rel, {
      name: name,
      gender: document.getElementById('a_gender').value,
      year: document.getElementById('a_year').value
    });
  };
}

/**
 * The same matcher the real app runs, offering an existing record before a
 * second copy of somebody gets made.
 */
function checkForDuplicate(text) {
  var zone = document.getElementById('dupeZone');
  if (!zone) return;
  if (text.trim().length < 4) { zone.innerHTML = ''; return; }

  var parsed = MTC_parseName(text);
  var hits = MTC_findCandidates(graph,
    { person_id: null, full_name: text, display_name: text,
      gender: document.getElementById('a_gender').value || parsed.genderHint || '' },
    58, 3);

  if (!hits.length) { zone.innerHTML = ''; return; }

  zone.innerHTML = '<div class="maybe"><h3>Already on the chart?</h3>' +
    '<p>Adding a second copy of one person is how a family tree splits in two.</p>' +
    hits.map(function (h) {
      var father = MTC_fatherOf(graph, h.person.person_id);
      return '<button data-link="' + h.person.person_id + '">' +
        '<b>' + esc(shortName(h.person.display_name)) + '</b>' +
        '<span style="color:var(--ink-3);font-size:12px">' +
          esc(father ? ' \u00b7 father: ' + shortName(graph.people[father].display_name)
                     : ' \u00b7 born ' + String(h.person.birth_date || '').slice(0, 4)) +
        '</span><span class="pc">' + h.score + '%</span></button>';
    }).join('') + '</div>';

  zone.querySelectorAll('[data-link]').forEach(function (b) {
    b.onclick = function () {
      linkExisting(document.getElementById('a_anchor').value, draft.rel, b.dataset.link);
    };
  });
}

var addSeq = 0;

function addPerson(anchorId, relationship, fields) {
  var id = 'N' + (++addSeq) + '-' + Date.now().toString(36);
  var parsed = MTC_parseName(fields.name);

  DATA.people.push({
    person_id: id,
    display_name: fields.name,
    full_name: fields.name,
    given_name: parsed.own[0] || fields.name,
    gender: fields.gender || parsed.genderHint || 'U',
    birth_date: fields.year ? fields.year + '-01-01' : '',
    birth_precision: fields.year ? 'year' : 'unknown',
    is_living: 'TRUE',
    status: 'active',
    added: true
  });

  joinUp(anchorId, id, relationship);
  placeNew(id, anchorId, relationship);

  rebuild();
  saveAdditions();
  savePositions();
  buildNodes();
  state.selected = id;
  highlight(); drawWires(); describe(id);
  focusOn(id, Math.max(state.scale, 0.75));
  toastMsg(shortName(fields.name) + ' added.');
  closeDialog();
}

function linkExisting(anchorId, relationship, existingId) {
  if (anchorId === existingId) return toastMsg('That is the same person.');
  joinUp(anchorId, existingId, relationship);
  rebuild();
  saveAdditions();
  buildNodes();
  state.selected = existingId;
  highlight(); drawWires(); describe(existingId);
  focusOn(existingId, Math.max(state.scale, 0.75));
  toastMsg('Connected to ' + shortName(graph.people[existingId].display_name) + '.');
  closeDialog();
}

/** Writes the parent links or marriage the chosen relationship implies. */
function joinUp(anchorId, personId, relationship) {
  var anchor = graph.people[anchorId];
  var roleOf = function (p) {
    return p && p.gender === 'F' ? 'mother' : (p && p.gender === 'M' ? 'father' : 'guardian');
  };
  var link = function (childId, parentId, role) {
    DATA.parentage.push({ link_id: 'NL' + (++addSeq) + Date.now().toString(36),
      child_id: childId, parent_id: parentId, parent_role: role,
      relation_type: 'biological', status: 'active', added: true });
  };

  if (relationship === 'child_of') {
    link(personId, anchorId, roleOf(anchor));
    // A child added to one parent belongs to that parent's marriage too, which
    // is nearly always what the person entering it means.
    var spouses = KIN_spousesOf(graph, anchorId);
    for (var i = 0; i < spouses.length; i++) {
      if (spouses[i].status === 'current') {
        link(personId, spouses[i].personId, roleOf(graph.people[spouses[i].personId]));
        break;
      }
    }
    return;
  }
  if (relationship === 'parent_of') {
    var person = graph.people[personId] ||
      DATA.people[DATA.people.length - 1];
    link(anchorId, personId, roleOf(person));
    return;
  }
  if (relationship === 'spouse_of') {
    DATA.unions.push({ union_id: 'NU' + (++addSeq) + Date.now().toString(36),
      partner_a_id: anchorId, partner_b_id: personId, union_type: 'nikah',
      status: 'current', order_index: KIN_spousesOf(graph, anchorId).length + 1, added: true });
    return;
  }
  if (relationship === 'sibling_of') {
    var parents = graph.parentsOf[anchorId] || [];
    if (!parents.length) {
      toastMsg('Add their parents first \u2014 siblings are recorded by sharing parents.');
      return;
    }
    for (var p = 0; p < parents.length; p++) {
      link(personId, parents[p].parent_id, parents[p].parent_role);
    }
  }
}

/**
 * Where a new card lands.
 *
 * Placed relative to the person they were added through rather than by
 * re-running the layout, which would shuffle every card the family has already
 * arranged by hand. It then slides right until it is clear of anybody else.
 */
function placeNew(id, anchorId, relationship) {
  var a = pos[anchorId] || { x: 0, y: 0 };
  var step = M.NODE_H + M.GAP_Y;
  var spot = { x: a.x, y: a.y };

  if (relationship === 'child_of') spot = { x: a.x, y: a.y + step };
  else if (relationship === 'parent_of') spot = { x: a.x, y: a.y - step };
  else if (relationship === 'spouse_of') spot = { x: a.x + M.NODE_W + M.COUPLE_GAP, y: a.y };
  else spot = { x: a.x + M.NODE_W + M.GAP_X, y: a.y };

  var guard = 0;
  while (occupied(spot.x, spot.y) && guard++ < 60) spot.x += M.NODE_W + M.GAP_X;
  pos[id] = spot;
}

function occupied(x, y) {
  for (var id in pos) {
    if (!pos.hasOwnProperty(id)) continue;
    if (Math.abs(pos[id].x - x) < M.NODE_W && Math.abs(pos[id].y - y) < M.NODE_H) return true;
  }
  return false;
}

/* ---------- portraits ---------- */

/**
 * A portrait for one person.
 *
 * Downscaled in the browser before it is kept, because the real app has to do
 * the same: Apps Script cannot resize an image, and a phone photograph is
 * several megabytes. Here it stays in this browser; in the deployed app the
 * same square is copied into the family's Drive so every relative sees it.
 */
function pickPhoto(personId) {
  var input = document.getElementById('fileInput');
  input.value = '';
  input.onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    toastMsg('Preparing photo\u2026');
    squareThumb(file, 256).then(function (dataUrl) {
      photos[personId] = dataUrl;
      savePhotos();
      paintNodes();
      describe(state.selected);
      toastMsg('Photo added.');
    }).catch(function () { toastMsg('That file could not be read as an image.'); });
  };
  input.click();
}

function squareThumb(file, size) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('unreadable')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('not an image')); };
      img.onload = function () {
        var edge = Math.min(img.width, img.height);
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        // Centre-cropped to a square, so a portrait reads as a face on a small
        // round card rather than a letterboxed sliver.
        canvas.getContext('2d').drawImage(img,
          (img.width - edge) / 2, (img.height - edge) / 2, edge, edge, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- interaction ---------- */

var drag = null, pan = null, pinch = null;

document.getElementById('stage').addEventListener('pointerdown', function(e){
  // The legend has said its piece once somebody starts moving things about.
  var legend = document.querySelector('.legend');
  if (legend) legend.classList.add('gone');

  var node = e.target.closest('.node');
  if (node) {
    drag = {
      id: node.dataset.id, pointer: e.pointerId,
      dx: e.clientX / state.scale - pos[node.dataset.id].x,
      dy: e.clientY / state.scale - pos[node.dataset.id].y,
      moved: false
    };
    node.classList.add('dragging');
    node.setPointerCapture(e.pointerId);
    return;
  }
  pan = { x: e.clientX - state.tx, y: e.clientY - state.ty, pointer: e.pointerId };
  this.classList.add('panning');
  this.setPointerCapture(e.pointerId);
});

document.getElementById('stage').addEventListener('pointermove', function(e){
  if (drag && e.pointerId === drag.pointer) {
    pos[drag.id].x = e.clientX / state.scale - drag.dx;
    pos[drag.id].y = e.clientY / state.scale - drag.dy;
    drag.moved = true;
    nodeEls[drag.id].style.left = (pos[drag.id].x - M.NODE_W / 2) + 'px';
    nodeEls[drag.id].style.top  = (pos[drag.id].y - M.NODE_H / 2) + 'px';
    drawWires();
    return;
  }
  if (pan && e.pointerId === pan.pointer) {
    state.tx = e.clientX - pan.x;
    state.ty = e.clientY - pan.y;
    applyTransform();
  }
});

function endPointer(e) {
  if (drag && e.pointerId === drag.pointer) {
    nodeEls[drag.id].classList.remove('dragging');
    if (!drag.moved) {
      state.selected = state.selected === drag.id ? null : drag.id;
      highlight(); drawWires(); describe(state.selected);
    } else {
      savePositions();
    }
    drag = null;
  }
  if (pan && e.pointerId === pan.pointer) {
    pan = null;
    document.getElementById('stage').classList.remove('panning');
  }
}
document.getElementById('stage').addEventListener('pointerup', endPointer);
document.getElementById('stage').addEventListener('pointercancel', endPointer);

document.getElementById('stage').addEventListener('wheel', function(e){
  e.preventDefault();
  var rect = this.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var factor = Math.exp(-e.deltaY * 0.0015);
  var next = Math.max(0.12, Math.min(2.2, state.scale * factor));
  state.tx = mx - (mx - state.tx) * (next / state.scale);
  state.ty = my - (my - state.ty) * (next / state.scale);
  state.scale = next;
  applyTransform();
}, { passive: false });

// Pinch, for phones.
var touches = {};
document.getElementById('stage').addEventListener('touchstart', function(e){
  if (e.touches.length === 2) {
    pinch = {
      dist: touchDistance(e.touches),
      scale: state.scale,
      cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      cy: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      tx: state.tx, ty: state.ty
    };
    drag = null; pan = null;
  }
}, { passive: true });

document.getElementById('stage').addEventListener('touchmove', function(e){
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    var rect = this.getBoundingClientRect();
    var ratio = touchDistance(e.touches) / pinch.dist;
    var next = Math.max(0.12, Math.min(2.2, pinch.scale * ratio));
    var mx = pinch.cx - rect.left, my = pinch.cy - rect.top;
    state.tx = mx - (mx - pinch.tx) * (next / pinch.scale);
    state.ty = my - (my - pinch.ty) * (next / pinch.scale);
    state.scale = next;
    applyTransform();
  }
}, { passive: false });

document.getElementById('stage').addEventListener('touchend', function(e){
  if (e.touches.length < 2) pinch = null;
}, { passive: true });

function touchDistance(t) {
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy) || 1;
}

document.addEventListener('click', function(e){
  var ego = e.target.closest('[data-ego]');
  if (ego) {
    state.ego = ego.dataset.ego;
    drawChips(); paintNodes(); describe(state.selected);
    // Move to whoever is now reading, or the labels change under a part of the
    // chart they are not even looking at.
    if (state.scale >= LEGIBLE) focusOn(state.ego);
    return;
  }
  var lang = e.target.closest('[data-lang]');
  if (lang) { state.lang = lang.dataset.lang; drawChips(); paintNodes(); describe(state.selected); return; }
  var photoBtn = e.target.closest('[data-photo]');
  if (photoBtn) { pickPhoto(photoBtn.dataset.photo); return; }
  var relBtn = e.target.closest('[data-relative]');
  if (relBtn) { openAddPerson(relBtn.dataset.relative); return; }

  if (e.target.id === 'add' || e.target.closest('#add') ||
      e.target.id === 'stripAdd') { openAddPerson(state.selected); return; }
  if (e.target.id === 'scrim') { closeDialog(); return; }
  if (e.target.id === 'fit') fit();
  if (e.target.id === 'me') focusOn(state.ego, Math.max(state.scale, 0.92));
  if (e.target.id === 'arrange' || e.target.closest('#arrange')) {
    resetPositions();
    // People added here are placed relative to whoever they were added
    // through, so re-running the layout has to give them a home too.
    rebuildLayoutPositions();
    savePositions(); placeNodes(); openingView();
    toastMsg('Back to the suggested layout.');
  }
});

window.addEventListener('resize', function(){ drawWires(); });

/**
 * Re-running the layout, including anybody added since it last ran.
 */
function rebuildLayoutPositions() {
  layout = LAY_compute(graph, {});
  M = layout.metrics;
  pos = {};
  for (var id in layout.nodes) {
    if (id === '__partners' || !layout.nodes.hasOwnProperty(id)) continue;
    pos[id] = {
      x: layout.nodes[id].x - layout.bounds.minX + PAD,
      y: layout.nodes[id].y - layout.bounds.minY + PAD
    };
  }
}

/* ---------- start ---------- */

loadAdditions();
loadPhotos();
resetPositions();
loadPositions();
// Anybody restored from a previous visit who has no saved position yet.
for (var seedId in graph.people) {
  if (graph.people.hasOwnProperty(seedId) && !pos[seedId]) {
    pos[seedId] = { x: PAD, y: PAD };
  }
}
drawChips();
buildNodes();
describe(null);
document.getElementById('subtitle').textContent =
  'Salim family · ' + Object.keys(graph.people).length + ' people · three generations';
requestAnimationFrame(openingView);
</script>
